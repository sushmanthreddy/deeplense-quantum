apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-q2-40ep-export-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: q2-40epoch-validation-export
spec:
  nprocPerNode: "1"
  runPolicy:
    activeDeadlineSeconds: 1800
    cleanPodPolicy: None
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: data-volume
              persistentVolumeClaim:
                claimName: susmered-datavol-1
            - name: tmp
              emptyDir: {}
          containers:
            - name: pytorch
              image: docker.io/pytorch/pytorch@sha256:971fbeae82c0a5a7a970a264a8b8ce1c3426aa79df7111004ad2bc2640f7d89c
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/data/jobs/deeplense-quantum/d4-orqb-40epochs-20260713
              command: ["bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  export PYTHONDONTWRITEBYTECODE=1
                  export PYTHONUNBUFFERED=1
                  export HOME=/tmp
                  export TMPDIR=/tmp
                  export XDG_CACHE_HOME=/workspace/data/cache/xdg
                  export TORCH_HOME=/workspace/data/cache/torch
                  export OMP_NUM_THREADS=4
                  export MKL_NUM_THREADS=4

                  SOURCE=/workspace/data/jobs/deeplense-quantum/d4-orqb-40epochs-20260713/export_validation_40ep.py
                  ARCHIVE=/workspace/data/jobs/deeplense-quantum/d4-orqb-40epochs-20260713/source-f10aad3.tar
                  TRAINING=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/fixed-backbone-40epochs/seed-2/quantum-20260713-01
                  CACHE=/workspace/data/cache/d4-orqb/model_i_96_v1/development
                  OUTPUT=/workspace/data/outputs/deeplense-quantum-cudaq/model-i/q2-40epochs-cudaq-20260713-01/reference

                  test "$(sha256sum "${SOURCE}" | cut -d' ' -f1)" = "3add311f11d2af8b3b4ea30a3c5c381c97380243856bc8ac421b19f5416b9243"
                  test "$(sha256sum "${ARCHIVE}" | cut -d' ' -f1)" = "a687cd1a6c52cde6a8fdfb61d6df195002e40df8a18f76082d9acc0652540dc6"
                  test -f "${TRAINING}/run_provenance.json"
                  test -f "${TRAINING}/best.pt"
                  test ! -e "${OUTPUT}"
                  test -f "${CACHE}/images.npy"
                  test -f "${CACHE}/labels.npy"

                  EXTRACTED=/tmp/d4-orqb-source-f10aad3
                  test ! -e "${EXTRACTED}"
                  mkdir -p "${EXTRACTED}"
                  tar -xf "${ARCHIVE}" -C "${EXTRACTED}"
                  export PYTHONPATH="${EXTRACTED}/source-f10aad3/src"

                  echo "PROTOCOL validation-only export; official test closed"
                  nvidia-smi --query-gpu=index,name,uuid,driver_version,memory.total --format=csv,noheader
                  python - <<'PY'
                  import torch
                  print({
                      "torch": torch.__version__,
                      "cuda_runtime": torch.version.cuda,
                      "cuda_available": torch.cuda.is_available(),
                      "gpu_count": torch.cuda.device_count(),
                      "gpu": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
                      "bf16_supported": torch.cuda.is_bf16_supported() if torch.cuda.is_available() else False,
                  })
                  assert torch.cuda.is_available()
                  assert torch.cuda.device_count() == 1
                  PY

                  python "${SOURCE}" \
                    --source-archive "${ARCHIVE}" \
                    --training-root "${TRAINING}" \
                    --development-cache "${CACHE}" \
                    --output-dir "${OUTPUT}" \
                    --batch-size 128 \
                    --workers 4
              resources:
                requests:
                  cpu: "4"
                  memory: 32Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "4"
                  memory: 32Gi
                  nvidia.com/gpu: "1"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: data-volume
                  mountPath: /workspace/data
                - name: tmp
                  mountPath: /tmp
