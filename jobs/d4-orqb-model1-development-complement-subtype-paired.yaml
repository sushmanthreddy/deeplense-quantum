apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-haar-subres-comp-eval-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: development-complement-subtype-paired
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-complement-eval-01.XXXXXX)
              EXPECTED_SOURCE_SHA256=e2b3ce0a3bebd41af7e3031ff94a8762e5a3c1de06933b07df26289cc31dcbcb
              test "${EXPECTED_SOURCE_SHA256}" != "__REPLACE_AFTER_REDTEAM__"

              cp -a "${SOURCE_REPO}/src" "${RUN_REPO}/src"
              cp -a "${SOURCE_REPO}/tests" "${RUN_REPO}/tests"
              cd "${RUN_REPO}"
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256="${SOURCE_SHA256}"
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"

              export PYTHONPATH="${RUN_REPO}/src"
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export CUBLAS_WORKSPACE_CONFIG=:4096:8
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              python -m unittest discover -s tests -v
              nvidia-smi

              CACHE=/workspace/data/cache/d4-orqb/model_i_96_v1/development
              PAIR_ROOT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/annular-haar50-subtype-residual-paired-01
              OUTPUT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/annular-haar50-subtype-residual-paired-complement-01
              test -d "${CACHE}"
              test ! -L "${CACHE}"
              test -d "${PAIR_ROOT}"
              test ! -L "${PAIR_ROOT}"
              test ! -e "${OUTPUT}"
              test ! -L "${OUTPUT}"

              python -m d4_orqb.evaluate_development_complement \
                --development-cache "${CACHE}" \
                --paired-root "${PAIR_ROOT}" \
                --output-dir "${OUTPUT}" \
                --source-sha256 "${SOURCE_SHA256}" \
                --batch-size 256 \
                --workers 4

              export OUTPUT SOURCE_SHA256
              python - <<'PY'
              import json
              import os
              from pathlib import Path

              import numpy as np

              from d4_orqb.data import index_membership_sha256
              from d4_orqb.evaluate_development_complement import paired_gate
              from d4_orqb.evaluate_locked import (
                  mcnemar_exact,
                  metrics_from_probabilities,
              )

              output = Path(os.environ['OUTPUT'])
              analysis_path = output / 'analysis.json'
              prediction_path = output / 'complement_predictions.npz'
              assert output.is_dir() and not output.is_symlink()
              assert analysis_path.is_file() and not analysis_path.is_symlink()
              assert prediction_path.is_file() and not prediction_path.is_symlink()
              analysis = json.loads(analysis_path.read_text())
              assert analysis['source_sha256'] == os.environ['SOURCE_SHA256']
              assert analysis['official_test_opened'] is False
              assert analysis['q0_comparison_performed'] is False
              assert analysis['gate_provenance'][
                  'prior_validation_passed_full_gate'
              ] is False
              assert analysis['membership']['samples']['complement'] == 35020
              assert analysis['membership']['complement_class_counts'] == {
                  'axion': 11451, 'cdm': 12151, 'no_sub': 11418
              }
              assert analysis['membership']['membership_sha256']['complement'] == (
                  '16be51c4068f124d4408a224d5df8aba6a6baa909c113cbd99e6ad818c6aa831'
              )
              assert analysis['canonical_validation_replay'][
                  'subtype-trainable'
              ]['predicted_classes_exact'] is True
              assert analysis['canonical_validation_replay'][
                  'subtype-zero-control'
              ]['predicted_classes_exact'] is True
              assert isinstance(analysis['passed_full_gate'], bool)
              with np.load(prediction_path, allow_pickle=False) as values:
                  assert set(values.files) == {
                      'indices', 'labels', 'candidate_logits',
                      'candidate_probabilities', 'control_logits',
                      'control_probabilities',
                  }
                  assert len(values['indices']) == 35020
                  assert len(np.unique(values['indices'])) == 35020
                  assert index_membership_sha256(values['indices']) == (
                      '16be51c4068f124d4408a224d5df8aba6a6baa909c113cbd99e6ad818c6aa831'
                  )
                  assert np.bincount(values['labels'], minlength=3).tolist() == [
                      11451, 12151, 11418
                  ]
                  for key in ('candidate_logits', 'control_logits'):
                      assert np.isfinite(values[key]).all()
                      assert values[key].shape == (35020, 3)
                  for key in (
                      'candidate_probabilities', 'control_probabilities'
                  ):
                      probabilities = values[key]
                      assert np.isfinite(probabilities).all()
                      assert probabilities.shape == (35020, 3)
                      assert (probabilities >= 0.0).all()
                      assert (probabilities <= 1.0).all()
                      assert np.allclose(
                          probabilities.sum(1), 1.0, rtol=0.0, atol=2e-6
                      )
                  assert np.array_equal(
                      values['candidate_probabilities'].argmax(1),
                      values['candidate_logits'].argmax(1),
                  )
                  assert np.array_equal(
                      values['control_probabilities'].argmax(1),
                      values['control_logits'].argmax(1),
                  )
                  labels = values['labels'].astype(np.int64)
                  candidate_probabilities = values[
                      'candidate_probabilities'
                  ].astype(np.float64)
                  control_probabilities = values[
                      'control_probabilities'
                  ].astype(np.float64)
                  candidate_metrics = metrics_from_probabilities(
                      labels, candidate_probabilities,
                      ['axion', 'cdm', 'no_sub'],
                  )
                  control_metrics = metrics_from_probabilities(
                      labels, control_probabilities,
                      ['axion', 'cdm', 'no_sub'],
                  )
                  assert candidate_metrics == analysis['metrics'][
                      'subtype-trainable'
                  ]
                  assert control_metrics == analysis['metrics'][
                      'subtype-zero-control'
                  ]
                  candidate_correct_mask = (
                      candidate_probabilities.argmax(1) == labels
                  )
                  control_correct_mask = (
                      control_probabilities.argmax(1) == labels
                  )
                  per_class_delta = {}
                  for label, name in enumerate(('axion', 'cdm', 'no_sub')):
                      mask = labels == label
                      per_class_delta[name] = int(
                          (candidate_correct_mask & mask).sum()
                          - (control_correct_mask & mask).sum()
                      )
                  recomputed_mcnemar = mcnemar_exact(
                      labels, candidate_probabilities, control_probabilities
                  )
                  assert recomputed_mcnemar == analysis['mcnemar_exact']
                  gate = paired_gate(
                      candidate_correct=int(candidate_correct_mask.sum()),
                      control_correct=int(control_correct_mask.sum()),
                      bootstrap=analysis['paired_bootstrap_accuracy'],
                      mcnemar=recomputed_mcnemar,
                      per_class_delta=per_class_delta,
                      candidate_metrics=candidate_metrics,
                      control_metrics=control_metrics,
                  )
                  assert gate == analysis['predeclared_complement_gate']
                  assert gate['passed'] is analysis['passed_full_gate']
              print('COMPLEMENT_EVALUATION_VERIFIED', flush=True)
              PY
            env:
            - name: XDG_CACHE_HOME
              value: /workspace/data/cache/xdg
            - name: TORCH_HOME
              value: /workspace/data/cache/torch
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
