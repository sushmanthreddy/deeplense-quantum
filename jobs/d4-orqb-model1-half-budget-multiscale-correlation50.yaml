apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-mscorr50-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: half-budget-multiscale-correlation
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-mscorr50-01.XXXXXX)
              EXPECTED_SOURCE_SHA256=bbf1b1a182db0c38c0453f04ed4f6540d04b42dfbe28d45d216db1b7bbc71630
              EXPECTED_INITIALIZER_SHA256=15876c7f8ba5964919a5171b625591a7d81ab356cc565f09316976d12f3abeb5
              cp -a ${SOURCE_REPO}/src ${RUN_REPO}/src
              cp -a ${SOURCE_REPO}/tests ${RUN_REPO}/tests
              cd ${RUN_REPO}
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256=${SOURCE_SHA256}
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"
              export PYTHONPATH=${RUN_REPO}/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              python -m unittest discover -s tests -v
              nvidia-smi
              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              BASE=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data
              INITIALIZER=${BASE}/deep-se50-01/quantum/best.pt
              ROOT=${BASE}/multiscale-correlation50-01
              INITIALIZER_SHA256=$(sha256sum ${INITIALIZER} | cut -d' ' -f1)
              test "${INITIALIZER_SHA256}" = "${EXPECTED_INITIALIZER_SHA256}"
              mkdir -p ${ROOT}
              export ROOT SOURCE_SHA256 INITIALIZER_SHA256

              python - <<'PY'
              import json
              import os
              from pathlib import Path

              provenance = {
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'source_hash_locale': 'C',
                  'initializer_sha256': os.environ['INITIALIZER_SHA256'],
                  'initializer_scope': 'same hash-v1 half-training subset; no full-data weights',
                  'candidate': 'quantum-clean deep-SE multiscale mean/std/paired-correlation pooling',
                  'descriptor': 'block3 100 + block5 160 + final means 180 = 440; all features pass through the quantum bottleneck',
                  'classical_context_bypass': False,
                  'training_images': 35001,
                  'training_fraction_of_canonical_train': 35001 / 70021,
                  'inference_parameter_ceiling': 245221 // 2,
                  'predeclared_success_accuracy': 16740 / 17504,
                  'selection_scope': 'Model-I development validation only',
                  'official_test_opened': False,
              }
              root = Path(os.environ['ROOT'])
              (root / 'provenance.json').write_text(
                  json.dumps(provenance, indent=2, sort_keys=True) + '\n'
              )
              print('PROVENANCE', json.dumps(provenance, sort_keys=True), flush=True)
              PY

              python -m d4_orqb.train \
                --development-root ${DATA}/Model_I \
                --test-root ${DATA}/Model_I_test \
                --cache-root ${CACHE} --image-size 96 \
                --encoder-variant deep-se-mscorr --physics-variant base \
                --physics-summary moments --core quantum \
                --quantum-encoding angle --observable-readout pair \
                --heads 4 --reuploads 2 --epochs 40 --patience 8 \
                --validation-interval 2 --batch-size 256 --workers 4 --io-workers 8 \
                --encoder-learning-rate 0.0005 --learning-rate 0.003 \
                --core-learning-rate 0.005 --weight-decay 0.0001 \
                --label-smoothing 0.02 --dropout 0.10 \
                --photon-noise-probability 0.5 \
                --photon-count-min 2048 --photon-count-max 8192 \
                --max-train-per-class 11667 --train-subset-protocol hash-v1 \
                --seed 0 --split-seed 42 \
                --init-compatible-backbone-checkpoint ${INITIALIZER} \
                --output-dir ${ROOT}/quantum

              python - <<'PY'
              import hashlib
              import json
              from pathlib import Path
              import numpy as np
              from d4_orqb.evaluate_locked import (
                  metrics_from_probabilities,
                  stratified_paired_bootstrap_accuracy,
              )

              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/multiscale-correlation50-01')
              run = root / 'quantum'
              reduced = root.parent
              model_root = reduced.parent
              expected_membership = '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71'
              expected_manifest = 'c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025'
              report = json.loads((run / 'data_report.json').read_text())
              params = json.loads((run / 'parameter_report.json').read_text())
              config = json.loads((run / 'config.json').read_text())
              summary = json.loads((run / 'summary.json').read_text())
              initialization = json.loads((run / 'initialization_report.json').read_text())
              assert report['train_size'] == 35001
              assert report['train_membership_sha256'] == expected_membership
              assert report['development_manifest_sha256'] == expected_manifest
              assert report['official_test_cache_opened'] is False
              assert config['evaluate_test'] is False
              assert config['encoder_variant'] == 'deep-se-mscorr'
              assert config['physics_summary'] == 'moments'
              assert config['max_translation_pixels'] == 0
              assert params['total'] == 122549 <= 122610
              assert params['encoder'] == 117042
              assert params['orbit_projection'] == 3656
              assert params['quantum'] == 88
              assert params['head_and_context'] == 1763
              assert params['encoder_multiscale_correlation_pool'] is True
              assert summary['official_test_evaluated'] is False
              assert initialization['checkpoint_sha256'] == '15876c7f8ba5964919a5171b625591a7d81ab356cc565f09316976d12f3abeb5'
              assert initialization['skipped_tensors'] == []
              adapted = {item['key']: item for item in initialization['adapted_tensors']}
              assert adapted['encoder.final.0.weight']['source_shape'] == [200, 96, 1, 1]
              assert adapted['encoder.final.0.weight']['target_shape'] == [180, 96, 1, 1]
              projection = adapted['orbit_projection.weight']
              assert projection['source_shape'] == [8, 216]
              assert projection['target_shape'] == [8, 456]
              assert projection['target_multiscale_dim'] == 260
              assert projection['target_final_dim'] == 180
              assert projection['preserved_summary_dim'] == 16

              paths = {
                  'multiscale-correlation-quantum': run / 'best_validation_predictions.npz',
                  'morphology-fusion-quantum': reduced / 'morphology-fusion50-01' / 'quantum' / 'best_validation_predictions.npz',
                  'deep-se-quantum': reduced / 'deep-se50-01' / 'quantum' / 'best_validation_predictions.npz',
                  'spatial-stat-quantum': reduced / 'spatial-stat50-02' / 'quantum' / 'best_validation_predictions.npz',
                  'full-q0': model_root / 'full-development-01' / 'quantum' / 'best_validation_predictions.npz',
              }
              predictions = {}
              prediction_sha256 = {}
              reference_indices = reference_labels = None
              for name, path in paths.items():
                  prediction_sha256[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                  with np.load(path, allow_pickle=False) as data:
                      order = np.argsort(data['indices'])
                      indices = data['indices'][order]
                      labels = data['labels'][order]
                      probabilities = data['probabilities'][order].astype(np.float64)
                  if reference_indices is None:
                      reference_indices, reference_labels = indices, labels
                  else:
                      assert np.array_equal(indices, reference_indices)
                      assert np.array_equal(labels, reference_labels)
                  predictions[name] = probabilities
              metrics = {
                  name: metrics_from_probabilities(
                      reference_labels, probability, ['axion', 'cdm', 'no_sub']
                  )
                  for name, probability in predictions.items()
              }
              comparisons = {}
              for reference in (
                  'morphology-fusion-quantum',
                  'deep-se-quantum',
                  'spatial-stat-quantum',
                  'full-q0',
              ):
                  comparisons[f'multiscale-correlation-quantum-vs-{reference}'] = (
                      stratified_paired_bootstrap_accuracy(
                          reference_labels,
                          predictions['multiscale-correlation-quantum'],
                          predictions[reference],
                          samples=10000,
                          seed=20260721,
                      )
                  )
              result = {
                  'scope': 'Model-I development validation only; no test cache opened',
                  'source_sha256': 'bbf1b1a182db0c38c0453f04ed4f6540d04b42dfbe28d45d216db1b7bbc71630',
                  'training_images': 35001,
                  'inference_parameter_ceiling': 122610,
                  'candidate_parameters': 122549,
                  'candidate_quantum_parameters': 88,
                  'predeclared_success_accuracy': 16740 / 17504,
                  'metrics': metrics,
                  'comparisons': comparisons,
                  'prediction_file_sha256': prediction_sha256,
              }
              (root / 'analysis.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + '\n'
              )
              print('MULTISCALE_CORRELATION50_ANALYSIS', json.dumps(result, sort_keys=True), flush=True)
              PY
              chmod -R g+rX ${ROOT}
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 40Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 40Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
