apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-oofteachers-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: half-budget-oof-teachers
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-oofteachers-01.XXXXXX)
              EXPECTED_SOURCE_SHA256=2c6c88ab1084ada77a6240105b91643d6f4401f6a57e540222ffcc3dd3302293
              cp -a ${SOURCE_REPO}/src ${RUN_REPO}/src
              cp -a ${SOURCE_REPO}/tests ${RUN_REPO}/tests
              cd ${RUN_REPO}
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256=${SOURCE_SHA256}
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"
              export PYTHONPATH=${RUN_REPO}/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export CUBLAS_WORKSPACE_CONFIG=:4096:8
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              python -m unittest discover -s tests -v
              nvidia-smi
              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              BASE=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data
              ROOT=${BASE}/oof-teachers50-01
              test ! -e ${ROOT}
              mkdir -p ${ROOT}
              export ROOT SOURCE_SHA256

              python - <<'PY'
              import json
              import os
              from pathlib import Path

              record = {
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'protocol': 'two-fold fresh deterministic fixed-epoch teachers',
                  'architectures': ['deep-se-morph/moments-morphology', 'micro-stat/moments'],
                  'teacher_runs': 4,
                  'fixed_epoch': 40,
                  'parent_training_images': 35001,
                  'fold_sizes': [17501, 17500],
                  'initialization': 'fresh; no full-half or external checkpoint',
                  'canonical_development_validation_samples_used': 0,
                  'official_test_samples_used': 0,
                  'target_temperature': 2.0,
                  'routing': 'both correct: mean; one correct: that teacher; neither: KD gate off',
              }
              root = Path(os.environ['ROOT'])
              (root / 'provenance.json').write_text(
                  json.dumps(record, indent=2, sort_keys=True) + '\n'
              )
              print('PROVENANCE', json.dumps(record, sort_keys=True), flush=True)
              PY

              COMMON="--development-root ${DATA}/Model_I --test-root ${DATA}/Model_I_test --cache-root ${CACHE} --image-size 96 --physics-variant base --quantum-encoding angle --observable-readout pair --core quantum --heads 4 --epochs 40 --patience 41 --validation-interval 40 --batch-size 256 --workers 4 --io-workers 8 --encoder-learning-rate 0.0005 --learning-rate 0.003 --core-learning-rate 0.005 --weight-decay 0.0001 --label-smoothing 0.02 --dropout 0.10 --photon-noise-probability 0.5 --photon-count-min 2048 --photon-count-max 8192 --max-train-per-class 11667 --train-subset-protocol hash-v1 --split-seed 42 --deterministic --save-last-validation-predictions"

              python -m d4_orqb.train ${COMMON} \
                --encoder-variant deep-se-morph \
                --physics-summary moments-morphology --reuploads 2 \
                --oof-teacher-fold-index 1 --seed 101 \
                --output-dir ${ROOT}/morph-heldout0

              python -m d4_orqb.train ${COMMON} \
                --encoder-variant deep-se-morph \
                --physics-summary moments-morphology --reuploads 2 \
                --oof-teacher-fold-index 0 --seed 100 \
                --output-dir ${ROOT}/morph-heldout1

              python -m d4_orqb.train ${COMMON} \
                --encoder-variant micro-stat \
                --physics-summary moments --reuploads 3 \
                --oof-teacher-fold-index 1 --seed 101 \
                --output-dir ${ROOT}/spatial-heldout0

              python -m d4_orqb.train ${COMMON} \
                --encoder-variant micro-stat \
                --physics-summary moments --reuploads 3 \
                --oof-teacher-fold-index 0 --seed 100 \
                --output-dir ${ROOT}/spatial-heldout1

              python -m d4_orqb.build_oof_targets \
                --morphology-heldout-fold0 ${ROOT}/morph-heldout0 \
                --morphology-heldout-fold1 ${ROOT}/morph-heldout1 \
                --spatial-heldout-fold0 ${ROOT}/spatial-heldout0 \
                --spatial-heldout-fold1 ${ROOT}/spatial-heldout1 \
                --output-artifact ${ROOT}/oof_targets.npz \
                --output-report ${ROOT}/oof_targets.json

              python - <<'PY'
              import hashlib
              import json
              import os
              from pathlib import Path

              root = Path(os.environ['ROOT'])
              report = json.loads((root / 'oof_targets.json').read_text())
              assert report['schema_version'] == 1
              assert report['protocol'] == 'two-fold-correctness-gated-morphology-spatial-v1'
              assert report['samples'] == 35001
              assert report['train_membership_sha256'] == '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71'
              assert report['development_manifest_sha256'] == 'c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025'
              assert report['temperature'] == 2.0
              assert report['canonical_development_validation_samples_used'] == 0
              assert report['official_test_samples_used'] == 0
              assert len(report['teachers']) == 4
              assert sum(report['routing_counts'].values()) == 35001
              assert report['artifact_sha256'] == hashlib.sha256(
                  (root / 'oof_targets.npz').read_bytes()
              ).hexdigest()
              analysis = {
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'scope': 'fixed half-training membership only; canonical validation and test unopened',
                  'teacher_accuracy': {
                      f"{item['architecture']}-heldout{item['heldout_fold']}": item['accuracy']
                      for item in report['teachers']
                  },
                  'routing_counts': report['routing_counts'],
                  'gated_samples': report['gated_samples'],
                  'gated_fraction': report['gated_fraction'],
                  'artifact_sha256': report['artifact_sha256'],
                  'target_probability_content_sha256': report['target_probability_content_sha256'],
                  'canonical_development_validation_samples_used': 0,
                  'official_test_samples_used': 0,
              }
              (root / 'analysis.json').write_text(
                  json.dumps(analysis, indent=2, sort_keys=True, allow_nan=False) + '\n'
              )
              print('OOF_TEACHER_ANALYSIS', json.dumps(analysis, sort_keys=True), flush=True)
              PY
            env:
            - name: XDG_CACHE_HOME
              value: /workspace/data/cache/xdg
            - name: TORCH_HOME
              value: /workspace/data/cache/torch
            - name: CUBLAS_WORKSPACE_CONFIG
              value: :4096:8
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
