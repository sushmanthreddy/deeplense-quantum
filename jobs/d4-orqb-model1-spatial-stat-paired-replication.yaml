apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-spatial-paired-rep-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: spatial-stat-paired-replication
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch@sha256:971fbeae82c0a5a7a970a264a8b8ce1c3426aa79df7111004ad2bc2640f7d89c
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-spatial-paired-rep-01.XXXXXX)
              EXPECTED_SOURCE_SHA256=09173b7743e85cc6c3fef9c92b52448fdfdf15690b1a1d1726de7d4507ab580f
              EXPECTED_BACKBONE_SHA256=2d3c49b94f60855279c878af925a34b6e274ee00c81f0d5ae758ceaadb8af200
              EXPECTED_BACKBONE_CONFIG_SHA256=c6731986a6eafeb63218ad6275c5cd6d9a907bbfd5ca44b6e4c867e66aece9da
              EXPECTED_BACKBONE_DATA_SHA256=6f8e03e63ad06113d4ab879110e1e0787882fac1e4c8ee6397c2a697e7beef19
              EXPECTED_BACKBONE_PARAMS_SHA256=3dd9cfeae8cf6bc06b9365f485dbf5e6d65b707d01f23cc6021ac8822ded5e26
              EXPECTED_BACKBONE_SUMMARY_SHA256=0988a02c9e39bd76f1f4728ceb011d4e0c73fd24b930e88b89ad0fb632d37144
              EXPECTED_OLD_ANALYSIS_SHA256=013d75bd4fe33b9d983835ea190df730136395069cf0c6f96d852bf05924f0f1
              EXPECTED_OLD_Q_HISTORY_SHA256=ba6b8f45b0645e3837e505db885a7237e6e4a811fef6952f5a921690c82f21ae
              EXPECTED_OLD_C_HISTORY_SHA256=577f4bf115494e552ae91def05604bc11395366202cfb6dfd4ddb1472775f6f8
              test "${EXPECTED_SOURCE_SHA256}" != "__REPLACE_AFTER_REDTEAM__"

              cp -a "${SOURCE_REPO}/src" "${RUN_REPO}/src"
              cp -a "${SOURCE_REPO}/tests" "${RUN_REPO}/tests"
              cd "${RUN_REPO}"
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256="${SOURCE_SHA256}"
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"

              export PYTHONPATH="${RUN_REPO}/src"
              export PYTHONUNBUFFERED=1
              export PYTHONHASHSEED=0
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export CUBLAS_WORKSPACE_CONFIG=:4096:8
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              python -m unittest discover -s tests -v
              nvidia-smi
              python - <<'PY'
              import json
              import torch

              assert torch.cuda.is_available()
              assert torch.cuda.device_count() == 1
              assert torch.cuda.is_bf16_supported()
              value = torch.arange(1024, device='cuda', dtype=torch.float32)
              assert float(value.square().sum().cpu()) > 0
              print('CUDA_CONTRACT', json.dumps({
                  'torch': torch.__version__,
                  'cuda_runtime': torch.version.cuda,
                  'gpu': torch.cuda.get_device_name(0),
                  'gpu_count': torch.cuda.device_count(),
                  'bf16_supported': torch.cuda.is_bf16_supported(),
              }, sort_keys=True), flush=True)
              PY

              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE_ROOT=/workspace/data/cache/d4-orqb
              DEVELOPMENT_CACHE=${CACHE_ROOT}/model_i_96_v1/development
              REDUCED=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data
              BACKBONE_ROOT=${REDUCED}/micro50-01/context
              BACKBONE=${BACKBONE_ROOT}/best.pt
              OLD_SPATIAL=${REDUCED}/spatial-stat50-02
              ROOT=${REDUCED}/spatial-stat50-paired-replication-01
              INITIALIZERS=${ROOT}/initializers
              RUNS=${ROOT}/runs
              EVALUATION=${ROOT}/evaluation
              UNUSED_TEST_SENTINEL=${DATA}/__OFFICIAL_TEST_LOCKED__

              test -d "${DEVELOPMENT_CACHE}"
              test ! -L "${DEVELOPMENT_CACHE}"
              test ! -e "${ROOT}"
              test ! -L "${ROOT}"
              test "$(sha256sum "${DEVELOPMENT_CACHE}/images.npy" | cut -d' ' -f1)" = c3c639584e0a9e2d6ba369e3fb41ba0451b2170a362ec419fa1182e55d5ce070
              test "$(sha256sum "${DEVELOPMENT_CACHE}/labels.npy" | cut -d' ' -f1)" = 3a12100d1df155738b57255e6625ba1287c2d74c5bab53bce2cd0597afe89b17
              test "$(sha256sum "${DEVELOPMENT_CACHE}/metadata.json" | cut -d' ' -f1)" = 9f36faff5fc3300b97512b1c29439b2e993888318a31835938749e10fbf12379
              test "$(sha256sum "${DEVELOPMENT_CACHE}/manifest.csv" | cut -d' ' -f1)" = c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025
              test "$(sha256sum "${CACHE_ROOT}/model_i_96_v1/split_seed42_val0.2000.npz" | cut -d' ' -f1)" = 143a759d9b4e6f5d6e8906a3b4ce38026528634f422f1953b9ae69cab7e59ff1
              test "$(sha256sum "${BACKBONE}" | cut -d' ' -f1)" = "${EXPECTED_BACKBONE_SHA256}"
              test "$(sha256sum "${BACKBONE_ROOT}/config.json" | cut -d' ' -f1)" = "${EXPECTED_BACKBONE_CONFIG_SHA256}"
              test "$(sha256sum "${BACKBONE_ROOT}/data_report.json" | cut -d' ' -f1)" = "${EXPECTED_BACKBONE_DATA_SHA256}"
              test "$(sha256sum "${BACKBONE_ROOT}/parameter_report.json" | cut -d' ' -f1)" = "${EXPECTED_BACKBONE_PARAMS_SHA256}"
              test "$(sha256sum "${BACKBONE_ROOT}/summary.json" | cut -d' ' -f1)" = "${EXPECTED_BACKBONE_SUMMARY_SHA256}"
              test "$(sha256sum "${OLD_SPATIAL}/analysis.json" | cut -d' ' -f1)" = "${EXPECTED_OLD_ANALYSIS_SHA256}"
              test "$(sha256sum "${OLD_SPATIAL}/quantum/history.json" | cut -d' ' -f1)" = "${EXPECTED_OLD_Q_HISTORY_SHA256}"
              test "$(sha256sum "${OLD_SPATIAL}/classical/history.json" | cut -d' ' -f1)" = "${EXPECTED_OLD_C_HISTORY_SHA256}"

              mkdir -p "${ROOT}" "${RUNS}"
              export ROOT SOURCE_SHA256 EXPECTED_BACKBONE_SHA256
              python - <<'PY'
              import json
              import os
              from pathlib import Path

              root = Path(os.environ['ROOT'])
              protocol = {
                  'schema_version': 1,
                  'protocol_id': 'paired-spatial-stat-fixed-three-seed-development-v1',
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'immutable_container_image': 'docker.io/pytorch/pytorch@sha256:971fbeae82c0a5a7a970a264a8b8ce1c3426aa79df7111004ad2bc2640f7d89c',
                  'backbone_sha256': os.environ['EXPECTED_BACKBONE_SHA256'],
                  'seeds': [0, 1, 2],
                  'balanced_training_order': ['0:quantum', '0:classical', '1:classical', '1:quantum', '2:quantum', '2:classical'],
                  'training_images_per_model': 35001,
                  'canonical_training_images': 70021,
                  'parameters_per_model': 122573,
                  'parameter_ceiling': 122610,
                  'quantum_core_parameters': 132,
                  'classical_core_parameters': 132,
                  'fixed_endpoint_epoch': 40,
                  'canonical_validation_evaluations_during_fit': 1,
                  'primary_dataset': 'development training complement (35020 images)',
                  'primary_dataset_disclosure': 'training-disjoint for these models but previously exposed by another development experiment; not an unseen holdout',
                  'canonical_validation_role': 'exact endpoint replay and predeclared directional consistency only',
                  'noninferiority_margin': 0.005,
                  'strict_superiority_practical_floor': 0.002,
                  'strict_superiority_requires_all_three_positive_and_directional_mcnemar_p_below_0_05': True,
                  'bootstrap': '100000 class-stratified resamples of examples carrying all six correctness outcomes; seeds not resampled',
                  'epoch_40_disclosure': 'original maximum schedule, chosen with the old seed-0 validation history known',
                  'random_seed_population_claim': False,
                  'official_test_opened': False,
                  'required_inert_test_root_sentinel_supplied': True,
                  'official_test_dataset_path_supplied': False,
              }
              (root / 'predecision_protocol.json').write_text(
                  json.dumps(protocol, indent=2, sort_keys=True, allow_nan=False) + '\n'
              )
              print('PREDECISION_PROTOCOL', json.dumps(protocol, sort_keys=True), flush=True)
              PY

              python -m d4_orqb.spatial_paired_init \
                --backbone-checkpoint "${BACKBONE}" \
                --output-dir "${INITIALIZERS}" \
                --seeds 0 1 2

              run_arm() {
                SEED="$1"
                CORE="$2"
                INIT="${INITIALIZERS}/seed-${SEED}/${CORE}-init.pt"
                OUTPUT="${RUNS}/seed-${SEED}/${CORE}"
                TRAINING_RNG_SEED=$((20000 + SEED))
                echo "RUN_ARM seed=${SEED} core=${CORE} output=${OUTPUT}"
                python -m d4_orqb.train \
                  --development-root "${DATA}/Model_I" \
                  --test-root "${UNUSED_TEST_SENTINEL}" \
                  --cache-root "${CACHE_ROOT}" \
                  --output-dir "${OUTPUT}" \
                  --image-size 96 \
                  --core "${CORE}" \
                  --encoder-variant micro-stat \
                  --physics-variant base \
                  --physics-summary moments \
                  --quantum-encoding angle \
                  --observable-readout pair \
                  --heads 4 \
                  --reuploads 3 \
                  --epochs 40 \
                  --patience 41 \
                  --validation-interval 40 \
                  --fixed-final-validation-only \
                  --save-last-validation-predictions \
                  --deterministic \
                  --training-rng-seed "${TRAINING_RNG_SEED}" \
                  --save-stochastic-trace \
                  --batch-size 256 \
                  --workers 4 \
                  --io-workers 8 \
                  --encoder-learning-rate 0.0005 \
                  --learning-rate 0.003 \
                  --core-learning-rate 0.005 \
                  --weight-decay 0.0001 \
                  --label-smoothing 0.02 \
                  --dropout 0.10 \
                  --photon-noise-probability 0.5 \
                  --photon-count-min 2048 \
                  --photon-count-max 8192 \
                  --max-train-per-class 11667 \
                  --train-subset-protocol hash-v1 \
                  --seed "${SEED}" \
                  --split-seed 42 \
                  --init-full-checkpoint "${INIT}" \
                  --paired-spatial-init-report "${INITIALIZERS}/report.json"
              }

              run_arm 0 quantum
              run_arm 0 classical
              run_arm 1 classical
              run_arm 1 quantum
              run_arm 2 quantum
              run_arm 2 classical

              python -m d4_orqb.evaluate_spatial_replication \
                --development-cache "${DEVELOPMENT_CACHE}" \
                --runs-root "${RUNS}" \
                --output-dir "${EVALUATION}"

              export EVALUATION RUNS INITIALIZERS
              python - <<'PY'
              import hashlib
              import json
              import os
              from pathlib import Path

              root = Path(os.environ['ROOT'])
              evaluation = Path(os.environ['EVALUATION'])
              runs = Path(os.environ['RUNS'])
              initializers = Path(os.environ['INITIALIZERS'])
              analysis = json.loads((evaluation / 'analysis.json').read_text())
              protocol = json.loads((evaluation / 'protocol.json').read_text())
              assert analysis['official_test_opened'] is False
              assert analysis['protocol_gate']['passed'] is True
              assert analysis['parameter_statement']['parameters_per_model'] == 122573
              assert analysis['parameter_statement']['prediction_ensemble_used'] is False
              assert protocol['random_seed_population_claim'] is False
              assert protocol['official_test_argument_or_code_path'] is False
              initializer_report = json.loads((initializers / 'report.json').read_text())
              assert initializer_report['seeds'] == [0, 1, 2]
              assert initializer_report['official_test_opened'] is False
              for seed in range(3):
                  q = runs / f'seed-{seed}' / 'quantum'
                  c = runs / f'seed-{seed}' / 'classical'
                  assert json.loads((q / 'stochastic_trace.json').read_text()) == json.loads((c / 'stochastic_trace.json').read_text())
                  for run in (q, c):
                      config = json.loads((run / 'config.json').read_text())
                      summary = json.loads((run / 'summary.json').read_text())
                      assert config['evaluate_test'] is False
                      assert summary['official_test_evaluated'] is False
                      assert 'test' not in summary
                      assert not (run / 'test_predictions.npz').exists()
              artifact_hashes = {}
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.name != 'artifact_sha256.json':
                      artifact_hashes[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
              (root / 'artifact_sha256.json').write_text(
                  json.dumps(artifact_hashes, indent=2, sort_keys=True) + '\n'
              )
              print('FINAL_PRIMARY_DECISIONS', json.dumps(analysis['primary_decisions'], sort_keys=True), flush=True)
              print('ARTIFACT_COUNT', len(artifact_hashes), flush=True)
              PY
              chmod -R g+rX "${ROOT}"
            env:
            - name: XDG_CACHE_HOME
              value: /workspace/data/cache/xdg
            - name: TORCH_HOME
              value: /workspace/data/cache/torch
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
