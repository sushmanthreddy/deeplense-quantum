apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-r1-02
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: half-budget-reduced-data-round1
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              cd /workspace/data/repos/deeplense-quantum
              export PYTHONPATH=/workspace/data/repos/deeplense-quantum/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              nvidia-smi
              df -hT /workspace/data

              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              ROOT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/round1-12p5-v2
              COMMON="--development-root ${DATA}/Model_I --test-root ${DATA}/Model_I_test --cache-root ${CACHE} --image-size 96 --physics-variant base --physics-summary moments --heads 4 --reuploads 2 --epochs 40 --patience 10 --validation-interval 4 --batch-size 256 --workers 4 --io-workers 8 --encoder-learning-rate 0.0005 --learning-rate 0.003 --core-learning-rate 0.005 --max-train-per-class 2916 --train-subset-protocol hash-v1 --seed 0 --split-seed 42"

              for ENCODER in eca micro; do
                python -m d4_orqb.train ${COMMON} \
                  --output-dir ${ROOT}/${ENCODER}/context \
                  --encoder-variant ${ENCODER} --core classical --include-context
              done

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/eca/q-angle \
                --encoder-variant eca --core quantum --quantum-encoding angle \
                --init-backbone-checkpoint ${ROOT}/eca/context/best.pt

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/eca/q-angle-hier015 \
                --encoder-variant eca --core quantum --quantum-encoding angle \
                --hierarchical-loss-weight 0.15 \
                --init-backbone-checkpoint ${ROOT}/eca/context/best.pt

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/eca/q-boltzmann \
                --encoder-variant eca --core quantum --quantum-encoding boltzmann \
                --init-backbone-checkpoint ${ROOT}/eca/context/best.pt

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/eca/q-gibbs \
                --encoder-variant eca --core quantum --quantum-encoding gibbs \
                --init-backbone-checkpoint ${ROOT}/eca/context/best.pt

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/micro/q-angle \
                --encoder-variant micro --core quantum --quantum-encoding angle \
                --init-backbone-checkpoint ${ROOT}/micro/context/best.pt

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/micro/q-gibbs \
                --encoder-variant micro --core quantum --quantum-encoding gibbs \
                --init-backbone-checkpoint ${ROOT}/micro/context/best.pt

              python - <<'PY'
              import json
              from pathlib import Path

              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/round1-12p5-v2')
              names = (
                  'eca/q-angle',
                  'eca/q-angle-hier015',
                  'eca/q-boltzmann',
                  'eca/q-gibbs',
                  'micro/q-angle',
                  'micro/q-gibbs',
              )
              expected_membership = '445df8478328ec7cadaf137f3efed25720e345c676f58ebadef47f1204a15bfd'
              records = []
              for name in names:
                  run = root / name
                  summary = json.loads((run / 'summary.json').read_text())
                  report = json.loads((run / 'data_report.json').read_text())
                  parameters = json.loads((run / 'parameter_report.json').read_text())
                  config = json.loads((run / 'config.json').read_text())
                  assert report['train_size'] == 8748
                  assert report['train_counts'] == {'axion': 2916, 'cdm': 2916, 'no_sub': 2916}
                  assert report['validation_size'] == 17504
                  assert report['train_membership_sha256'] == expected_membership
                  assert report['official_test_cache_opened'] is False
                  assert config['evaluate_test'] is False
                  assert parameters['total'] <= 122610
                  records.append({
                      'name': name,
                      'accuracy': summary['validation']['accuracy'],
                      'macro_auc_ovr': summary['validation']['macro_auc_ovr'],
                      'macro_f1': summary['validation']['macro_f1'],
                      'nll': summary['validation']['nll'],
                      'best_epoch': summary['best_epoch'],
                      'parameters': parameters['total'],
                      'core_update_l2': summary['core_update_l2'],
                      'wall_seconds': summary['wall_seconds'],
                      'train_membership_sha256': expected_membership,
                  })
              records.sort(key=lambda item: (item['accuracy'], item['macro_auc_ovr']), reverse=True)
              result = {
                  'scope': 'Model-I development only; no test cache opened',
                  'round': '12.4934% training subset, seed 0',
                  'records': records,
              }
              (root / 'leaderboard.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False)
              )
              print('ROUND1_LEADERBOARD', json.dumps(result, sort_keys=True), flush=True)
              PY
              chmod -R g+rX ${ROOT}
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
