apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-replay-diag-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: development-d4-replay-diagnostic
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              cd /workspace/data/repos/deeplense-quantum
              export PYTHONPATH=/workspace/data/repos/deeplense-quantum/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4

              python - <<'PY'
              import json
              from pathlib import Path
              from types import SimpleNamespace
              import numpy as np
              import torch
              from d4_orqb.evaluate_locked import (
                  _load_sealed_model,
                  _make_eval_loader,
                  evaluate_model,
                  load_and_verify_seal,
                  load_validation_predictions,
                  metrics_from_probabilities,
                  validate_cache_structure,
                  validate_split_indices,
              )

              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i')
              seal_dir = root / 'locked/d4-orqb-model-i-v2-20260711-seal'
              dev_cache = Path('/workspace/data/cache/d4-orqb/model_i_96_v1/development')
              output = root / 'diagnostics/d4-replay-01.json'
              output.parent.mkdir(parents=True, exist_ok=True)
              manifest, _ = load_and_verify_seal(seal_dir)
              class_names = manifest['development_cache']['classes']
              development = validate_cache_structure(dev_cache, class_names)
              records = []
              for name, member in manifest['members'].items():
                  member_dir = seal_dir / 'members' / name
                  with np.load(member_dir / 'split_indices.npz', allow_pickle=False) as split:
                      _, val_indices = validate_split_indices(
                          development['labels'], split['train'], split['val']
                      )
                  expected = load_validation_predictions(
                      member_dir / 'best_validation_predictions.npz',
                      val_indices,
                      development['labels'],
                      class_names,
                  )
                  expected_metrics = metrics_from_probabilities(
                      expected['labels'], expected['probabilities'], class_names
                  )
                  for batch_size, repeat in ((128, 0), (128, 1), (256, 0)):
                      model = _load_sealed_model(
                          seal_dir, name, member, len(class_names), torch.device('cuda')
                      )
                      args = SimpleNamespace(
                          batch_size=batch_size, workers=4, loader_seed=42
                      )
                      actual = evaluate_model(
                          model,
                          member['kind'],
                          _make_eval_loader(dev_cache, val_indices, args),
                          torch.device('cuda'),
                      )
                      del model
                      torch.cuda.empty_cache()
                      difference = np.abs(actual['probabilities'] - expected['probabilities'])
                      metrics = metrics_from_probabilities(
                          actual['labels'], actual['probabilities'], class_names
                      )
                      records.append({
                          'member': name,
                          'batch_size': batch_size,
                          'repeat': repeat,
                          'max_probability_abs': float(difference.max()),
                          'p99_probability_abs': float(np.quantile(difference, 0.99)),
                          'mean_probability_abs': float(difference.mean()),
                          'changed_predictions': int(np.count_nonzero(
                              actual['probabilities'].argmax(1) != expected['probabilities'].argmax(1)
                          )),
                          'metrics': metrics,
                          'metric_delta': {
                              key: float(metrics[key]) - float(expected_metrics[key])
                              for key in ('accuracy','balanced_accuracy','macro_f1','macro_auc_ovr','nll','brier','ece_15')
                          },
                      })
              result = {
                  'scope': 'Model-I development validation only; no test argument',
                  'records': records,
              }
              output.write_text(json.dumps(result, indent=2, sort_keys=True, allow_nan=False))
              concise = [
                  {key: item[key] for key in (
                      'member','batch_size','repeat','max_probability_abs',
                      'p99_probability_abs','mean_probability_abs','changed_predictions','metric_delta'
                  )}
                  for item in records
              ]
              print('D4_REPLAY_DIAGNOSTIC', json.dumps(concise, sort_keys=True), flush=True)
              PY
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
