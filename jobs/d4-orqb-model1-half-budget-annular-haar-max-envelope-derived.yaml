apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-haar-maxenv-02
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: half-budget-annular-haar-max-envelope-derived
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-haar-maxenv-02.XXXXXX)
              EXPECTED_SOURCE_SHA256=c217a7232badf82bd31b4318344811803e228cb246c133e386bedc5c263f257e
              EXPECTED_PRIMARY_SHA256=9850a7d0c53b6332739696a9952b94a85a9ecea9c567fe5e0e85bdeef296b144
              EXPECTED_DONOR_SHA256=7e37c72ef9571642b8f314903c780730a4fc68bdb2547f3d746844961297643b
              EXPECTED_PRIMARY_PREDICTIONS_SHA256=96e375f1004f27e5032341604764126e9cb7f30ee319387da49df088d9b02569
              cp -a ${SOURCE_REPO}/src ${RUN_REPO}/src
              cp -a ${SOURCE_REPO}/tests ${RUN_REPO}/tests
              cd ${RUN_REPO}
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256=${SOURCE_SHA256}
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"
              export PYTHONPATH=${RUN_REPO}/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              python -m unittest discover -s tests -v
              nvidia-smi

              BASE=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data
              PRIMARY_RUN=${BASE}/annular-haar50-01/quantum
              DONOR_RUN=${BASE}/annular-haar50-subtype-residual-01/quantum
              DEVELOPMENT_CACHE=/workspace/data/cache/d4-orqb/model_i_96_v1/development
              OUTPUT_DIR=${BASE}/annular-haar50-max-envelope-derived-02
              test ! -e ${OUTPUT_DIR}
              test "$(sha256sum ${PRIMARY_RUN}/best.pt | cut -d' ' -f1)" = "${EXPECTED_PRIMARY_SHA256}"
              test "$(sha256sum ${DONOR_RUN}/last.pt | cut -d' ' -f1)" = "${EXPECTED_DONOR_SHA256}"
              test "$(sha256sum ${PRIMARY_RUN}/best_validation_predictions.npz | cut -d' ' -f1)" = "${EXPECTED_PRIMARY_PREDICTIONS_SHA256}"

              # Frozen, development-only promotion gate declared before inference.
              PROMOTION_CORRECT=16750
              PROMOTION_MACRO_AUC=0.992624
              PROMOTION_NLL=0.145003
              export PROMOTION_CORRECT PROMOTION_MACRO_AUC PROMOTION_NLL SOURCE_SHA256

              python -m d4_orqb.evaluate_derived_validation \
                --primary-run ${PRIMARY_RUN} \
                --donor-run ${DONOR_RUN} \
                --development-cache ${DEVELOPMENT_CACHE} \
                --output-dir ${OUTPUT_DIR} \
                --device cuda --batch-size 256 --workers 4 --loader-seed 42

              python - <<'PY'
              import hashlib
              import json
              import math
              import os
              from pathlib import Path

              import numpy as np

              root = Path(
                  '/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/'
                  'reduced-data/annular-haar50-max-envelope-derived-02'
              )
              metrics = json.loads((root / 'metrics.json').read_text())
              params = json.loads((root / 'parameter_report.json').read_text())
              config = json.loads((root / 'config.json').read_text())
              provenance = json.loads((root / 'provenance.json').read_text())
              seal = json.loads((root / 'artifact_seal.json').read_text())
              derived = metrics['derived']
              base = metrics['primary_base']
              audit = metrics['hierarchy_audit']
              correct = sum(
                  int(derived['confusion_matrix'][i][i]) for i in range(3)
              )
              base_correct = sum(
                  int(base['confusion_matrix'][i][i]) for i in range(3)
              )
              with np.load(root / 'validation_predictions.npz', allow_pickle=False) as data:
                  labels = data['labels'].astype(np.int64)
                  base_predictions = data['base_predictions'].astype(np.int64)
                  predictions = data['predictions'].astype(np.int64)
              base_ok = base_predictions == labels
              derived_ok = predictions == labels
              derived_only = int((derived_ok & ~base_ok).sum())
              base_only = int((base_ok & ~derived_ok).sum())
              discordant = derived_only + base_only
              if discordant:
                  tail = sum(
                      math.comb(discordant, k)
                      for k in range(min(derived_only, base_only) + 1)
                  ) / (2 ** discordant)
                  mcnemar_exact_p = min(1.0, 2.0 * tail)
              else:
                  mcnemar_exact_p = 1.0

              assert metrics['validation_samples'] == 17504
              assert metrics['official_test_evaluated'] is False
              assert config['development_validation_only'] is True
              assert config['official_test_supported'] is False
              assert config['evaluate_test'] is False
              assert config['core'] == 'quantum'
              assert config['haar_subtype_max_envelope'] is True
              assert config['haar_subtype_residual'] is True
              assert params['total'] == 122610
              assert params['inference_total'] == 122610
              assert params['quantum'] == 88
              assert params['requires_grad_during_derivation_and_evaluation'] == 0
              assert params['optimized_during_derivation'] == 0
              assert audit['parent_envelope_exact_all_samples'] is True
              assert audit['no_sub_argmax_indicator_exact_all_samples'] is True
              assert audit['predicted_no_sub_membership_changes'] == 0
              assert provenance['training']['performed'] is False
              assert provenance['training']['fitting_samples'] == 0
              assert provenance['training']['validation_samples_used_for_transform_design'] == 17504
              assert provenance['training']['official_test_samples_used'] == 0
              assert provenance['official_test']['opened'] is False
              assert provenance['official_test']['evaluated'] is False
              assert provenance['development']['audit']['images_fingerprint']['sha256'] == 'c3c639584e0a9e2d6ba369e3fb41ba0451b2170a362ec419fa1182e55d5ce070'
              assert len(seal['artifacts']) == 6

              gates = {
                  'correct_at_least': int(os.environ['PROMOTION_CORRECT']),
                  'macro_auc_ovr_at_least': float(os.environ['PROMOTION_MACRO_AUC']),
                  'nll_at_most': float(os.environ['PROMOTION_NLL']),
                  'parent_envelope_exact': True,
                  'no_sub_membership_exact': True,
              }
              passed = (
                  correct >= gates['correct_at_least']
                  and derived['macro_auc_ovr'] >= gates['macro_auc_ovr_at_least']
                  and derived['nll'] <= gates['nll_at_most']
                  and audit['parent_envelope_exact_all_samples']
                  and audit['no_sub_argmax_indicator_exact_all_samples']
              )
              result = {
                  'scope': 'Model-I development validation only; locked test unsupported and unopened',
                  'analysis_status': 'exploratory-derived-candidate; validation-informed transform',
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'training_performed': False,
                  'training_images_in_source_models': 35001,
                  'parameters': 122610,
                  'quantum_parameters': 88,
                  'gates': gates,
                  'passed_predeclared_promotion_gate': passed,
                  'correct': correct,
                  'base_correct': base_correct,
                  'derived_only_correct': derived_only,
                  'base_only_correct': base_only,
                  'mcnemar_exact_two_sided_p': mcnemar_exact_p,
                  'metrics': derived,
                  'primary_replay_metrics': base,
                  'hierarchy_audit': audit,
                  'derived_checkpoint_sha256': hashlib.sha256(
                      (root / 'derived.pt').read_bytes()
                  ).hexdigest(),
                  'prediction_sha256': hashlib.sha256(
                      (root / 'validation_predictions.npz').read_bytes()
                  ).hexdigest(),
                  'official_test_opened': False,
              }
              (root / 'analysis.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + '\n'
              )
              print('MAX_ENVELOPE_ANALYSIS', json.dumps(result, sort_keys=True), flush=True)
              PY
            env:
            - name: XDG_CACHE_HOME
              value: /workspace/data/cache/xdg
            - name: TORCH_HOME
              value: /workspace/data/cache/torch
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
