apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-freeze-v2
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: locked-protocol-freeze-v2
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              cd /workspace/data/repos/deeplense-quantum
              export PYTHONPATH=/workspace/data/repos/deeplense-quantum/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4

              nvidia-smi
              ROOT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i
              python -m d4_orqb.evaluate_locked freeze \
                --development-cache /workspace/data/cache/d4-orqb/model_i_96_v1/development \
                --seal-dir ${ROOT}/locked/d4-orqb-model-i-v2-20260711-seal \
                --protocol-id d4-orqb-model-i-v2-20260711 \
                --expected-development-manifest-sha256 c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025 \
                --expected-test-manifest-sha256 02b8395f1f895e39b84b41053fe87061e975919c68eafd7789d099396a4a9bb5 \
                --expected-test-images-sha256 056159ec214987f62f5060f163449392cd9987e244b00cf01baabedafba43758 \
                --expected-test-labels-sha256 50457c13893e97a995a730f968ac53aa0de0c0bd22305089fc1ca1459d3546da \
                --expected-test-metadata-sha256 cf0dade18aecdfa007c672276d2e510b4ab383a482fff192796f96e0e8793c6d \
                --expected-test-samples 15000 \
                --expected-test-cache-path /workspace/data/cache/d4-orqb/model_i_96_v1/test \
                --member q0=d4-orqb=${ROOT}/full-development-01/quantum \
                --member q1=d4-orqb=${ROOT}/fixed-backbone-replication/seed-1/quantum \
                --member q2=d4-orqb=${ROOT}/fixed-backbone-replication/seed-2/quantum \
                --member c0=d4-orqb=${ROOT}/full-development-01/classical \
                --member c1=d4-orqb=${ROOT}/fixed-backbone-replication/seed-1/classical \
                --member c2=d4-orqb=${ROOT}/fixed-backbone-replication/seed-2/classical \
                --member radial_q=d4-orqb=${ROOT}/radial96-finetune-01/quantum \
                --member radial_c=d4-orqb=${ROOT}/radial96-finetune-01/classical \
                --ensemble q3=q0,q1,q2 \
                --ensemble c3=c0,c1,c2 \
                --ensemble qc0=q0,c0 \
                --ensemble qc6=q0,q1,q2,c0,c1,c2 \
                --comparison q3,c3,-0.0025 \
                --comparison q3,qc0,-0.0025 \
                --comparison q3,q0,0 \
                --comparison q0,c0,-0.0025 \
                --comparison qc0,q0,0 \
                --bootstrap-samples 10000 \
                --analysis-seed 20260711 \
                --replay-atol 0.002 \
                --settle-seconds 30 \
                --inference-batch-size 128 \
                --inference-workers 4 \
                --inference-loader-seed 42
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
