apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-teacher50-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: same-subset-distillation-teacher
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-teacher50-01.XXXXXX)
              EXPECTED_SOURCE_SHA256=4a887200aa01d1fd48fc756757eef788ff70ede7f09f274f85c97ce89283abdd
              cp -a ${SOURCE_REPO}/src ${RUN_REPO}/src
              cp -a ${SOURCE_REPO}/tests ${RUN_REPO}/tests
              cd ${RUN_REPO}
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256=${SOURCE_SHA256}
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"
              export PYTHONPATH=${RUN_REPO}/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              nvidia-smi
              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              ROOT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/teacher50-01
              STUDENT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/morph50-02/photon-quantum
              mkdir -p ${ROOT}
              export ROOT SOURCE_SHA256
              python - <<'PY'
              import json
              import os
              from pathlib import Path

              record = {
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'source_hash_locale': 'C',
                  'source_hash_scope': 'sorted SHA256 stream of src/d4_orqb/**/*.py and tests/**/*.py',
                  'training_subset': 'hash-v1, max 11667 per class',
                  'training_only_teacher': True,
                  'official_test_opened': False,
              }
              (Path(os.environ['ROOT']) / 'provenance.json').write_text(
                  json.dumps(record, indent=2, sort_keys=True) + '\n'
              )
              print('PROVENANCE', json.dumps(record, sort_keys=True), flush=True)
              PY

              python -m d4_orqb.train \
                --development-root ${DATA}/Model_I \
                --test-root ${DATA}/Model_I_test \
                --cache-root ${CACHE} --image-size 96 \
                --encoder-variant tiny --physics-variant base \
                --physics-summary moments --core classical --include-context \
                --observable-readout pair --heads 4 --reuploads 2 \
                --epochs 36 --patience 10 --validation-interval 2 \
                --batch-size 256 --workers 4 --io-workers 8 \
                --encoder-learning-rate 0.004 --learning-rate 0.004 \
                --core-learning-rate 0.006 --label-smoothing 0.02 \
                --max-train-per-class 11667 --train-subset-protocol hash-v1 \
                --seed 0 --split-seed 42 --output-dir ${ROOT}/teacher

              python - <<'PY'
              import json
              from pathlib import Path
              import numpy as np
              from d4_orqb.evaluate_locked import (
                  metrics_from_probabilities,
                  stratified_paired_bootstrap_accuracy,
              )

              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/teacher50-01')
              teacher = root / 'teacher'
              student = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/morph50-02/photon-quantum')
              expected_membership = '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71'
              expected_manifest = 'c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025'
              report = json.loads((teacher / 'data_report.json').read_text())
              params = json.loads((teacher / 'parameter_report.json').read_text())
              config = json.loads((teacher / 'config.json').read_text())
              summary = json.loads((teacher / 'summary.json').read_text())
              assert report['train_size'] == 35001
              assert report['train_membership_sha256'] == expected_membership
              assert report['development_manifest_sha256'] == expected_manifest
              assert report['official_test_cache_opened'] is False
              assert params['total'] == 272933
              assert params['core_architecture'] == 'classical'
              assert params['encoder_variant'] == 'tiny'
              assert config['include_context'] is True
              assert config['evaluate_test'] is False
              assert config['max_train_per_class'] == 11667
              assert config['train_subset_protocol'] == 'hash-v1'

              predictions = {}
              reference_indices = reference_labels = None
              for name, path in {
                  'teacher': teacher / 'best_validation_predictions.npz',
                  'photon-quantum-student': student / 'best_validation_predictions.npz',
              }.items():
                  with np.load(path, allow_pickle=False) as data:
                      order = np.argsort(data['indices'])
                      indices = data['indices'][order]
                      labels = data['labels'][order]
                      probabilities = data['probabilities'][order].astype(np.float64)
                  if reference_indices is None:
                      reference_indices, reference_labels = indices, labels
                  else:
                      assert np.array_equal(indices, reference_indices)
                      assert np.array_equal(labels, reference_labels)
                  predictions[name] = probabilities
              metrics = {
                  name: metrics_from_probabilities(
                      reference_labels, probability, ['axion', 'cdm', 'no_sub']
                  )
                  for name, probability in predictions.items()
              }
              result = {
                  'scope': 'Model-I development validation only; no test cache opened',
                  'teacher_training_images': 35001,
                  'teacher_inference_parameters': 272933,
                  'student_inference_parameters': 122437,
                  'teacher_best_epoch': summary['best_epoch'],
                  'metrics': metrics,
                  'teacher_vs_student_accuracy': stratified_paired_bootstrap_accuracy(
                      reference_labels,
                      predictions['teacher'],
                      predictions['photon-quantum-student'],
                      samples=10000,
                      seed=20260712,
                  ),
              }
              (root / 'analysis.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + '\n'
              )
              print('TEACHER50_ANALYSIS', json.dumps(result, sort_keys=True), flush=True)
              PY
              chmod -R g+rX ${ROOT}
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
