apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-morph50-02
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: half-budget-morphology-50pct
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-morph50-02.XXXXXX)
              EXPECTED_SOURCE_SHA256=4a887200aa01d1fd48fc756757eef788ff70ede7f09f274f85c97ce89283abdd
              EXPECTED_CONTEXT_SHA256=2d3c49b94f60855279c878af925a34b6e274ee00c81f0d5ae758ceaadb8af200
              mkdir -p ${RUN_REPO}
              cp -a ${SOURCE_REPO}/src ${RUN_REPO}/src
              cp -a ${SOURCE_REPO}/tests ${RUN_REPO}/tests
              cd ${RUN_REPO}
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256=${SOURCE_SHA256}
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"
              export PYTHONPATH=${RUN_REPO}/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              nvidia-smi
              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              BASE=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/micro50-01
              ROOT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/morph50-02
              CONTEXT=${BASE}/context/best.pt
              test -s ${CONTEXT}
              CONTEXT_SHA256=$(sha256sum ${CONTEXT} | cut -d' ' -f1)
              echo CONTEXT_SHA256=${CONTEXT_SHA256}
              test "${CONTEXT_SHA256}" = "${EXPECTED_CONTEXT_SHA256}"
              mkdir -p ${ROOT}
              export SOURCE_SHA256 CONTEXT_SHA256 ROOT
              python - <<'PY'
              import json
              import os
              from pathlib import Path

              provenance = {
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'source_hash_scope': 'sorted SHA256 stream of src/d4_orqb/**/*.py and tests/**/*.py',
                  'initializer_checkpoint': '/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/micro50-01/context/best.pt',
                  'initializer_sha256': os.environ['CONTEXT_SHA256'],
                  'official_test_opened': False,
              }
              (Path(os.environ['ROOT']) / 'provenance.json').write_text(
                  json.dumps(provenance, indent=2, sort_keys=True) + '\n'
              )
              print('PROVENANCE', json.dumps(provenance, sort_keys=True), flush=True)
              PY
              COMMON="--development-root ${DATA}/Model_I --test-root ${DATA}/Model_I_test --cache-root ${CACHE} --image-size 96 --encoder-variant micro --physics-variant base --heads 4 --reuploads 2 --epochs 40 --patience 8 --validation-interval 2 --batch-size 256 --workers 4 --io-workers 8 --encoder-learning-rate 0.0005 --learning-rate 0.003 --core-learning-rate 0.005 --max-train-per-class 11667 --train-subset-protocol hash-v1 --seed 0 --split-seed 42 --init-backbone-checkpoint ${CONTEXT}"

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/spectral-quantum --core quantum \
                --physics-summary moments-spectral --quantum-encoding angle \
                --observable-readout pair

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/spectral-classical --core classical \
                --physics-summary moments-spectral --observable-readout pair

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/photon-quantum --core quantum \
                --physics-summary moments --quantum-encoding angle \
                --observable-readout pair --photon-noise-probability 0.5 \
                --photon-count-min 2048 --photon-count-max 8192

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/photon-classical --core classical \
                --physics-summary moments --observable-readout pair \
                --photon-noise-probability 0.5 \
                --photon-count-min 2048 --photon-count-max 8192

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/plaquette-quantum --core quantum \
                --physics-summary moments --quantum-encoding angle \
                --observable-readout plaquette

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/plaquette-classical --core classical \
                --physics-summary moments --observable-readout plaquette

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/plaquette-hybrid --core hybrid \
                --physics-summary moments --quantum-encoding angle \
                --observable-readout plaquette --branch-loss-weight 0.25

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/plaquette-classical-fusion \
                --core classical-fusion --physics-summary moments \
                --observable-readout plaquette --branch-loss-weight 0.25

              python - <<'PY'
              import json
              from pathlib import Path
              import numpy as np
              from d4_orqb.evaluate_locked import (
                  metrics_from_probabilities,
                  stratified_paired_bootstrap_accuracy,
              )

              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/morph50-02')
              base = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/micro50-01')
              full_q0 = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/full-development-01/quantum/best_validation_predictions.npz')
              expected_hash = '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71'
              expected_manifest = 'c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025'
              expected_parameters = {
                  'spectral-quantum': 122565,
                  'spectral-classical': 122565,
                  'photon-quantum': 122437,
                  'photon-classical': 122437,
                  'plaquette-quantum': 122437,
                  'plaquette-classical': 122437,
                  'plaquette-hybrid': 122526,
                  'plaquette-classical-fusion': 122526,
              }
              expected_cores = {
                  'spectral-quantum': 'quantum',
                  'spectral-classical': 'classical',
                  'photon-quantum': 'quantum',
                  'photon-classical': 'classical',
                  'plaquette-quantum': 'quantum',
                  'plaquette-classical': 'classical',
                  'plaquette-hybrid': 'hybrid',
                  'plaquette-classical-fusion': 'classical-fusion',
              }
              predictions, runs = {}, {}
              reference_indices = reference_labels = None
              for name, expected_total in expected_parameters.items():
                  run = root / name
                  summary = json.loads((run / 'summary.json').read_text())
                  report = json.loads((run / 'data_report.json').read_text())
                  params = json.loads((run / 'parameter_report.json').read_text())
                  config = json.loads((run / 'config.json').read_text())
                  initialization = json.loads(
                      (run / 'initialization_report.json').read_text()
                  )
                  assert report['train_size'] == 35001
                  assert report['train_membership_sha256'] == expected_hash
                  assert report['development_manifest_sha256'] == expected_manifest
                  assert report['official_test_cache_opened'] is False
                  assert params['total'] == expected_total <= 122610
                  assert params['core_architecture'] == expected_cores[name]
                  assert params['quantum'] == (88 if expected_cores[name] in ('quantum', 'hybrid') else 0)
                  assert config['core'] == expected_cores[name]
                  assert config['evaluate_test'] is False
                  assert config['max_train_per_class'] == 11667
                  assert config['train_subset_protocol'] == 'hash-v1'
                  assert config['seed'] == 0 and config['split_seed'] == 42
                  assert initialization['checkpoint'] == str(base / 'context' / 'best.pt')
                  if name.startswith('spectral-'):
                      assert params['physics_summary'] == 'moments-spectral'
                      assert config['physics_summary'] == 'moments-spectral'
                  else:
                      assert params['physics_summary'] == 'moments'
                  if name.startswith('plaquette-'):
                      assert params['observable_readout'] == 'plaquette'
                  else:
                      assert params['observable_readout'] == 'pair'
                  if name.startswith('photon-'):
                      assert config['photon_noise_probability'] == 0.5
                      assert config['photon_count_min'] == 2048
                      assert config['photon_count_max'] == 8192
                  else:
                      assert config['photon_noise_probability'] == 0.0
                  with np.load(run / 'best_validation_predictions.npz', allow_pickle=False) as data:
                      order = np.argsort(data['indices'])
                      indices = data['indices'][order]
                      labels = data['labels'][order]
                      probabilities = data['probabilities'][order].astype(np.float64)
                  if reference_indices is None:
                      reference_indices, reference_labels = indices, labels
                  else:
                      assert np.array_equal(indices, reference_indices)
                      assert np.array_equal(labels, reference_labels)
                  predictions[name] = probabilities
                  runs[name] = {
                      'parameters': expected_total,
                      'best_epoch': summary['best_epoch'],
                      'validation': summary['validation'],
                      'core_update_l2': summary['core_update_l2'],
                      'parallel_core': summary.get('parallel_core'),
                  }

              references = {}
              for name, path in {
                  'pair-quantum': base / 'quantum' / 'best_validation_predictions.npz',
                  'pair-classical': base / 'classical' / 'best_validation_predictions.npz',
                  'full-q0': full_q0,
              }.items():
                  with np.load(path, allow_pickle=False) as data:
                      order = np.argsort(data['indices'])
                      assert np.array_equal(data['indices'][order], reference_indices)
                      assert np.array_equal(data['labels'][order], reference_labels)
                      references[name] = data['probabilities'][order].astype(np.float64)

              all_predictions = {**references, **predictions}
              metrics = {
                  name: metrics_from_probabilities(
                      reference_labels, probabilities, ['axion', 'cdm', 'no_sub']
                  )
                  for name, probabilities in all_predictions.items()
              }
              comparisons = {}
              pairs = (
                  ('spectral-quantum', 'pair-quantum'),
                  ('spectral-classical', 'pair-classical'),
                  ('spectral-quantum', 'spectral-classical'),
                  ('photon-quantum', 'pair-quantum'),
                  ('photon-classical', 'pair-classical'),
                  ('photon-quantum', 'photon-classical'),
                  ('plaquette-quantum', 'pair-quantum'),
                  ('plaquette-classical', 'pair-classical'),
                  ('plaquette-quantum', 'plaquette-classical'),
                  ('plaquette-hybrid', 'plaquette-classical-fusion'),
              )
              for candidate, reference in pairs:
                  reference_probabilities = predictions.get(
                      reference, references.get(reference)
                  )
                  comparisons[f'{candidate}-vs-{reference}'] = (
                      stratified_paired_bootstrap_accuracy(
                          reference_labels,
                          predictions[candidate],
                          reference_probabilities,
                          samples=10000,
                          seed=20260712,
                      )
                  )
              for candidate in predictions:
                  comparisons[f'{candidate}-vs-full-q0'] = (
                      stratified_paired_bootstrap_accuracy(
                          reference_labels,
                          predictions[candidate],
                          references['full-q0'],
                          samples=10000,
                          seed=20260712,
                      )
                  )
              result = {
                  'scope': 'Model-I development validation only; no test cache opened',
                  'training_images': 35001,
                  'training_fraction': 35001 / 70021,
                  'train_membership_sha256': expected_hash,
                  'runs': runs,
                  'metrics': metrics,
                  'comparisons': comparisons,
              }
              (root / 'analysis.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False)
              )
              print('MORPH50_ANALYSIS', json.dumps(result, sort_keys=True), flush=True)
              PY
              chmod -R g+rX ${ROOT}
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
