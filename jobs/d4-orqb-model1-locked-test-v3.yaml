apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-test-v3
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: locked-official-test-v3
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail

              # Safety latch: the job exits before any evaluator or test-cache access
              # until this value is replaced by the reviewed v3 seal digest.
              FROZEN_MANIFEST_SHA256=2a3b55de874522bf6d0bd1c3846536a2db11b0ca431011aa5b5f6e8ecd84c50b
              if [[ ! "${FROZEN_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "ABORTED_PRE_TEST_MARKER=awaiting-reviewed-v3-seal-digest"
                echo "NO_OFFICIAL_TEST_INFERENCE_PERFORMED"
                exit 0
              fi

              cd /workspace/data/repos/deeplense-quantum
              export PYTHONPATH=/workspace/data/repos/deeplense-quantum/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4

              nvidia-smi
              ROOT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i
              python -m d4_orqb.evaluate_locked run-test \
                --seal-dir ${ROOT}/locked/d4-orqb-model-i-v3-20260711-seal \
                --development-cache /workspace/data/cache/d4-orqb/model_i_96_v1/development \
                --test-cache /workspace/data/cache/d4-orqb/model_i_96_v1/test \
                --output-dir ${ROOT}/locked/d4-orqb-model-i-v3-20260711-official-test \
                --confirm d4-orqb-model-i-v3-20260711:${FROZEN_MANIFEST_SHA256} \
                --batch-size 128 --workers 4 --loader-seed 42
              chmod -R g+rX ${ROOT}/locked/d4-orqb-model-i-v3-20260711-official-test
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
