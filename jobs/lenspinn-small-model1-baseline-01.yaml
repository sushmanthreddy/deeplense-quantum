apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: lenspinn-small-m1-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: lenspinn-repaired-baseline
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              cd /workspace/data/repos/deeplense-quantum
              export PYTHONPATH=/workspace/data/repos/deeplense-quantum/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export XDG_CACHE_HOME=/workspace/data/cache/xdg
              export TORCH_HOME=/workspace/data/cache/torch
              export HF_HOME=/workspace/data/models/huggingface
              export PIP_CACHE_DIR=/workspace/data/cache/pip
              mkdir -p ${XDG_CACHE_HOME} ${TORCH_HOME} ${HF_HOME} ${PIP_CACHE_DIR}

              nvidia-smi
              python -m pip install --disable-pip-version-check \
                timm==0.9.16 huggingface_hub==0.23.5 safetensors==0.4.3
              python -c 'import timm, huggingface_hub, safetensors; print("DEPENDENCIES", timm.__version__, huggingface_hub.__version__, safetensors.__version__)'

              python -m d4_orqb.train_lenspinn \
                --development-root /workspace/data/datasets/DEEPLENS_DATASETS/Model_I \
                --test-root /workspace/data/datasets/DEEPLENS_DATASETS/Model_I_test \
                --cache-root /workspace/data/cache/d4-orqb \
                --output-dir /workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/baselines/lenspinn-repaired-small-01 \
                --image-size 96 --patch-size 32 \
                --reconstruction differentiable \
                --epochs 50 --patience 50 --batch-size 256 \
                --workers 4 --io-workers 8 \
                --learning-rate 0.0001 --weight-decay 0.01 \
                --seed 0 --split-seed 42
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    # Kept suspended until the archived integer reconstruction and the
    # differentiable repaired baseline are separated explicitly.
    suspend: true
