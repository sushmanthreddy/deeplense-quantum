apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-micro50-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: half-budget-micro-50pct
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              cd /workspace/data/repos/deeplense-quantum
              export PYTHONPATH=/workspace/data/repos/deeplense-quantum/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              nvidia-smi
              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              ROOT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/micro50-01
              COMMON="--development-root ${DATA}/Model_I --test-root ${DATA}/Model_I_test --cache-root ${CACHE} --image-size 96 --encoder-variant micro --physics-variant base --physics-summary moments --heads 4 --reuploads 2 --epochs 40 --patience 8 --validation-interval 2 --batch-size 256 --workers 4 --io-workers 8 --encoder-learning-rate 0.0005 --learning-rate 0.003 --core-learning-rate 0.005 --max-train-per-class 11667 --train-subset-protocol hash-v1 --seed 0 --split-seed 42"

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/context --core classical --include-context

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/quantum --core quantum --quantum-encoding angle \
                --init-backbone-checkpoint ${ROOT}/context/best.pt

              python -m d4_orqb.train ${COMMON} \
                --output-dir ${ROOT}/classical --core classical \
                --init-backbone-checkpoint ${ROOT}/context/best.pt

              python - <<'PY'
              import json
              from pathlib import Path
              import numpy as np
              from d4_orqb.evaluate_locked import (
                  mcnemar_exact,
                  metrics_from_probabilities,
                  stratified_paired_bootstrap_accuracy,
                  uniform_probability_ensemble,
              )

              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/micro50-01')
              full_q0 = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/full-development-01/quantum/best_validation_predictions.npz')
              expected_hash = '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71'
              runs = {}
              predictions = {}
              reference_indices = reference_labels = None
              for name in ('quantum', 'classical'):
                  run = root / name
                  summary = json.loads((run / 'summary.json').read_text())
                  report = json.loads((run / 'data_report.json').read_text())
                  params = json.loads((run / 'parameter_report.json').read_text())
                  assert report['train_size'] == 35001
                  assert report['train_membership_sha256'] == expected_hash
                  assert report['official_test_cache_opened'] is False
                  assert params['total'] == 122437
                  with np.load(run / 'best_validation_predictions.npz', allow_pickle=False) as data:
                      indices = data['indices']
                      labels = data['labels']
                      probabilities = data['probabilities'].astype(np.float64)
                  order = np.argsort(indices)
                  indices, labels, probabilities = indices[order], labels[order], probabilities[order]
                  if reference_indices is None:
                      reference_indices, reference_labels = indices, labels
                  else:
                      assert np.array_equal(indices, reference_indices)
                      assert np.array_equal(labels, reference_labels)
                  predictions[name] = probabilities
                  runs[name] = {
                      'parameters': params['total'],
                      'best_epoch': summary['best_epoch'],
                      'validation': summary['validation'],
                      'core_update_l2': summary['core_update_l2'],
                  }

              with np.load(full_q0, allow_pickle=False) as data:
                  full_indices = data['indices']
                  full_labels = data['labels']
                  full_probabilities = data['probabilities'].astype(np.float64)
              order = np.argsort(full_indices)
              assert np.array_equal(full_indices[order], reference_indices)
              assert np.array_equal(full_labels[order], reference_labels)
              full_probabilities = full_probabilities[order]
              predictions['qc'] = uniform_probability_ensemble(
                  [predictions['quantum'], predictions['classical']]
              )
              metrics = {
                  name: metrics_from_probabilities(
                      reference_labels, probabilities, ['axion', 'cdm', 'no_sub']
                  )
                  for name, probabilities in predictions.items()
              }
              comparisons = {}
              for name in ('quantum', 'classical', 'qc'):
                  comparisons[f'{name}-vs-full-q0'] = {
                      'bootstrap': stratified_paired_bootstrap_accuracy(
                          reference_labels,
                          predictions[name],
                          full_probabilities,
                          samples=10000,
                          seed=20260712,
                      ),
                      'mcnemar': mcnemar_exact(
                          reference_labels, predictions[name], full_probabilities
                      ),
                  }
              result = {
                  'scope': 'Model-I development validation only; no test cache opened',
                  'training_images': 35001,
                  'training_fraction': 35001 / 70021,
                  'train_membership_sha256': expected_hash,
                  'runs': runs,
                  'metrics': metrics,
                  'comparisons': comparisons,
              }
              (root / 'analysis.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False)
              )
              print('MICRO50_ANALYSIS', json.dumps(result, sort_keys=True), flush=True)
              PY
              chmod -R g+rX ${ROOT}
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
