apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-test-v2
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: locked-official-test-v2
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              echo "ABORTED_PRE_TEST_MARKER=validation-replay-tolerance"
              echo "NO_OFFICIAL_TEST_INFERENCE_PERFORMED"
              exit 0

              cd /workspace/data/repos/deeplense-quantum
              export PYTHONPATH=/workspace/data/repos/deeplense-quantum/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4

              nvidia-smi
              ROOT=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i
              python -m d4_orqb.evaluate_locked run-test \
                --seal-dir ${ROOT}/locked/d4-orqb-model-i-v2-20260711-seal \
                --development-cache /workspace/data/cache/d4-orqb/model_i_96_v1/development \
                --test-cache /workspace/data/cache/d4-orqb/model_i_96_v1/test \
                --output-dir ${ROOT}/locked/d4-orqb-model-i-v2-20260711-official-test \
                --confirm d4-orqb-model-i-v2-20260711:a6874498160fc10a6546ba997e88df551afa7146439e770e34d35d7d8bdade96 \
                --batch-size 128 --workers 4 --loader-seed 42
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
