apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-morphfusion50-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: half-budget-morphology-fusion
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-morphfusion50-01.XXXXXX)
              EXPECTED_SOURCE_SHA256=96f1ff6c98d8a2ab48701ed503c225f0f5f33e0fc56384ea78734f2507de267c
              EXPECTED_INITIALIZER_SHA256=15876c7f8ba5964919a5171b625591a7d81ab356cc565f09316976d12f3abeb5
              cp -a ${SOURCE_REPO}/src ${RUN_REPO}/src
              cp -a ${SOURCE_REPO}/tests ${RUN_REPO}/tests
              cd ${RUN_REPO}
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256=${SOURCE_SHA256}
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"
              export PYTHONPATH=${RUN_REPO}/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              python -m unittest tests.test_d4_orqb -v
              nvidia-smi
              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              BASE=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data
              INITIALIZER=${BASE}/deep-se50-01/quantum/best.pt
              ROOT=${BASE}/morphology-fusion50-01
              INITIALIZER_SHA256=$(sha256sum ${INITIALIZER} | cut -d' ' -f1)
              echo INITIALIZER_SHA256=${INITIALIZER_SHA256}
              test "${INITIALIZER_SHA256}" = "${EXPECTED_INITIALIZER_SHA256}"
              mkdir -p ${ROOT}
              export ROOT SOURCE_SHA256 INITIALIZER_SHA256

              python - <<'PY'
              import json
              import os
              from pathlib import Path

              root = Path(os.environ['ROOT'])
              provenance = {
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'source_hash_locale': 'C',
                  'initializer_sha256': os.environ['INITIALIZER_SHA256'],
                  'initializer_scope': 'same hash-v1 half-training subset; no full-data weights',
                  'candidate': 'deep-SE plus fixed 60-D radial/angular morphology fusion and four-head D4 quantum core',
                  'architecture_scope': 'fixed-feature classical bypass and quantum angle conditioning; explicitly hybrid',
                  'morphology_normalization_scope': 'selected training indices only; zero validation and test samples',
                  'training_images': 35001,
                  'training_fraction_of_canonical_train': 35001 / 70021,
                  'inference_parameter_ceiling': 245221 // 2,
                  'predeclared_success_accuracy': 16740 / 17504,
                  'selection_scope': 'Model-I development validation only',
                  'official_test_opened': False,
              }
              (root / 'provenance.json').write_text(
                  json.dumps(provenance, indent=2, sort_keys=True) + '\n'
              )
              print('PROVENANCE', json.dumps(provenance, sort_keys=True), flush=True)
              PY

              COMMON="--development-root ${DATA}/Model_I --test-root ${DATA}/Model_I_test --cache-root ${CACHE} --image-size 96 --encoder-variant deep-se-morph --physics-variant base --physics-summary moments-morphology --quantum-encoding angle --observable-readout pair --heads 4 --reuploads 2 --epochs 40 --patience 8 --validation-interval 2 --batch-size 256 --workers 4 --io-workers 8 --encoder-learning-rate 0.0005 --learning-rate 0.003 --core-learning-rate 0.005 --weight-decay 0.0001 --label-smoothing 0.02 --dropout 0.10 --photon-noise-probability 0.5 --photon-count-min 2048 --photon-count-max 8192 --max-train-per-class 11667 --train-subset-protocol hash-v1 --seed 0 --split-seed 42 --init-compatible-backbone-checkpoint ${INITIALIZER}"

              python -m d4_orqb.train ${COMMON} \
                --core quantum --output-dir ${ROOT}/quantum

              if python - <<'PY'
              import json
              from pathlib import Path
              summary = json.loads((Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/morphology-fusion50-01/quantum') / 'summary.json').read_text())
              accuracy = summary['validation']['accuracy']
              print(f'CONTROL_GATE accuracy={accuracy:.12f} threshold={16740 / 17504:.12f}', flush=True)
              raise SystemExit(0 if accuracy >= 16740 / 17504 else 1)
              PY
              then
                python -m d4_orqb.train ${COMMON} \
                  --core classical --output-dir ${ROOT}/classical
              else
                python - <<'PY'
              import json
              from pathlib import Path
              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/morphology-fusion50-01')
              record = {
                  'reason': 'quantum candidate did not meet predeclared 16740/17504 validation gate',
                  'classical_control_run': False,
                  'official_test_opened': False,
              }
              (root / 'classical_control_skipped.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
              print('CONTROL_SKIPPED', json.dumps(record, sort_keys=True), flush=True)
              PY
              fi

              python - <<'PY'
              import hashlib
              import json
              from pathlib import Path
              import numpy as np
              from d4_orqb.evaluate_locked import (
                  metrics_from_probabilities,
                  stratified_paired_bootstrap_accuracy,
              )

              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/morphology-fusion50-01')
              reduced = root.parent
              model_root = reduced.parent
              expected_membership = '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71'
              expected_manifest = 'c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025'
              expected_source = '96f1ff6c98d8a2ab48701ed503c225f0f5f33e0fc56384ea78734f2507de267c'

              runs = {'morphology-fusion-quantum': root / 'quantum'}
              if (root / 'classical' / 'summary.json').exists():
                  runs['morphology-fusion-classical'] = root / 'classical'
              for name, run in runs.items():
                  summary = json.loads((run / 'summary.json').read_text())
                  report = json.loads((run / 'data_report.json').read_text())
                  params = json.loads((run / 'parameter_report.json').read_text())
                  config = json.loads((run / 'config.json').read_text())
                  initialization = json.loads((run / 'initialization_report.json').read_text())
                  normalization = json.loads((run / 'morphology_normalization.json').read_text())
                  assert report['train_size'] == 35001
                  assert report['train_membership_sha256'] == expected_membership
                  assert report['development_manifest_sha256'] == expected_manifest
                  assert report['official_test_cache_opened'] is False
                  assert config['evaluate_test'] is False
                  assert config['encoder_variant'] == 'deep-se-morph'
                  assert config['physics_summary'] == 'moments-morphology'
                  assert config['max_translation_pixels'] == 0
                  assert params['total'] == 122573 <= 122610
                  assert params['encoder'] == 118218
                  assert params['orbit_projection'] == 2152
                  assert params['head_and_context'] == 2115
                  assert params['morphology_context_dim'] == 60
                  assert summary['official_test_evaluated'] is False
                  assert normalization['fit_samples'] == 35001
                  assert normalization['validation_samples_used'] == 0
                  assert normalization['official_test_samples_used'] == 0
                  assert normalization['train_membership_sha256'] == expected_membership
                  assert initialization['checkpoint_sha256'] == '15876c7f8ba5964919a5171b625591a7d81ab356cc565f09316976d12f3abeb5'
                  assert initialization['method'] == 'exact-shape-declared-prefix'
                  assert initialization['skipped_tensors'] == []
                  adapted = {item['key']: item for item in initialization['adapted_tensors']}
                  assert adapted['encoder.final.0.weight']['source_shape'] == [200, 96, 1, 1]
                  assert adapted['encoder.final.0.weight']['target_shape'] == [192, 96, 1, 1]
                  projection = adapted['orbit_projection.weight']
                  assert projection['source_shape'] == [8, 216]
                  assert projection['target_shape'] == [8, 268]
                  assert projection['preserved_summary_dim'] == 16
                  if name.endswith('quantum'):
                      assert params['core_architecture'] == 'quantum' and params['quantum'] == 88
                  else:
                      assert params['core_architecture'] == 'classical' and params['quantum'] == 0

              paths = {
                  'morphology-fusion-quantum': root / 'quantum' / 'best_validation_predictions.npz',
                  'deep-se-quantum': reduced / 'deep-se50-01' / 'quantum' / 'best_validation_predictions.npz',
                  'spatial-stat-quantum': reduced / 'spatial-stat50-02' / 'quantum' / 'best_validation_predictions.npz',
                  'full-q0': model_root / 'full-development-01' / 'quantum' / 'best_validation_predictions.npz',
              }
              if 'morphology-fusion-classical' in runs:
                  paths['morphology-fusion-classical'] = root / 'classical' / 'best_validation_predictions.npz'
              predictions = {}
              prediction_sha256 = {}
              reference_indices = reference_labels = None
              for name, path in paths.items():
                  prediction_sha256[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                  with np.load(path, allow_pickle=False) as data:
                      order = np.argsort(data['indices'])
                      indices = data['indices'][order]
                      labels = data['labels'][order]
                      probabilities = data['probabilities'][order].astype(np.float64)
                  if reference_indices is None:
                      reference_indices, reference_labels = indices, labels
                  else:
                      assert np.array_equal(indices, reference_indices)
                      assert np.array_equal(labels, reference_labels)
                  predictions[name] = probabilities

              metrics = {
                  name: metrics_from_probabilities(
                      reference_labels, probability, ['axion', 'cdm', 'no_sub']
                  )
                  for name, probability in predictions.items()
              }
              comparisons = {}
              references = ['deep-se-quantum', 'spatial-stat-quantum', 'full-q0']
              if 'morphology-fusion-classical' in predictions:
                  references.insert(0, 'morphology-fusion-classical')
              for reference in references:
                  comparisons[f'morphology-fusion-quantum-vs-{reference}'] = (
                      stratified_paired_bootstrap_accuracy(
                          reference_labels,
                          predictions['morphology-fusion-quantum'],
                          predictions[reference],
                          samples=10000,
                          seed=20260719,
                      )
                  )
              result = {
                  'scope': 'Model-I development validation only; no test cache opened',
                  'source_sha256': expected_source,
                  'training_images': 35001,
                  'inference_parameter_ceiling': 122610,
                  'candidate_parameters': 122573,
                  'candidate_quantum_parameters': 88,
                  'predeclared_success_accuracy': 16740 / 17504,
                  'metrics': metrics,
                  'comparisons': comparisons,
                  'prediction_file_sha256': prediction_sha256,
              }
              (root / 'analysis.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + '\n'
              )
              print('MORPHOLOGY_FUSION50_ANALYSIS', json.dumps(result, sort_keys=True), flush=True)
              PY
              chmod -R g+rX ${ROOT}
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
