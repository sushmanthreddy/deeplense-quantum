apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-mixkd50-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: same-subset-subtype-mixup-distillation
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-mixkd50-01.XXXXXX)
              EXPECTED_SOURCE_SHA256=9affd833a0a750ff0672772a2879c13b06b5257ce94744238bdf3362359b3828
              EXPECTED_SPATIAL_SHA256=37dc7a2c518beafca3c4570c078012c323451a5327b6dcdc879586d92c8bc9cf
              EXPECTED_KD_SHA256=26ab4ea2b07d3bf8ecaadc4581472ada71f223ae06a986336890662663336f5e
              cp -a ${SOURCE_REPO}/src ${RUN_REPO}/src
              cp -a ${SOURCE_REPO}/tests ${RUN_REPO}/tests
              cd ${RUN_REPO}
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256=${SOURCE_SHA256}
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"
              export PYTHONPATH=${RUN_REPO}/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              python -m unittest tests.test_d4_orqb -v
              nvidia-smi
              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              BASE=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data
              SPATIAL=${BASE}/spatial-stat50-02/quantum
              KD=${BASE}/kd-ensemble50-02/student
              ROOT=${BASE}/subtype-mixup-kd50-01
              SPATIAL_SHA256=$(sha256sum ${SPATIAL}/best.pt | cut -d' ' -f1)
              KD_SHA256=$(sha256sum ${KD}/best.pt | cut -d' ' -f1)
              echo SPATIAL_SHA256=${SPATIAL_SHA256}
              echo KD_SHA256=${KD_SHA256}
              test "${SPATIAL_SHA256}" = "${EXPECTED_SPATIAL_SHA256}"
              test "${KD_SHA256}" = "${EXPECTED_KD_SHA256}"
              mkdir -p ${ROOT}
              export ROOT SOURCE_SHA256 SPATIAL_SHA256 KD_SHA256

              python - <<'PY'
              import json
              import os
              from pathlib import Path
              import numpy as np
              from d4_orqb.evaluate_locked import metrics_from_probabilities

              base = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data')
              probabilities = []
              reference_indices = reference_labels = None
              for path in (
                  base / 'spatial-stat50-02' / 'quantum' / 'best_validation_predictions.npz',
                  base / 'kd-ensemble50-02' / 'student' / 'best_validation_predictions.npz',
              ):
                  with np.load(path, allow_pickle=False) as data:
                      order = np.argsort(data['indices'])
                      indices = data['indices'][order]
                      labels = data['labels'][order]
                      values = data['probabilities'][order].astype(np.float64)
                  if reference_indices is None:
                      reference_indices, reference_labels = indices, labels
                  else:
                      assert np.array_equal(indices, reference_indices)
                      assert np.array_equal(labels, reference_labels)
                  probabilities.append(values)
              teacher = 0.5 * (probabilities[0] + probabilities[1])
              teacher_metrics = metrics_from_probabilities(
                  reference_labels, teacher, ['axion', 'cdm', 'no_sub']
              )
              assert teacher_metrics['accuracy'] > 0.9535
              provenance = {
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'source_hash_locale': 'C',
                  'student_initializer_sha256': os.environ['SPATIAL_SHA256'],
                  'teacher_checkpoint_sha256': [
                      os.environ['SPATIAL_SHA256'], os.environ['KD_SHA256']
                  ],
                  'teacher_method': 'equal probability ensemble of two same-subset quantum students',
                  'teacher_validation': teacher_metrics,
                  'mixup': 'cross-class axion/CDM only; Beta(0.4,0.4), anchor weight >= 0.5',
                  'training_images': 35001,
                  'inference_parameter_ceiling': 245221 // 2,
                  'official_test_opened': False,
              }
              root = Path(os.environ['ROOT'])
              (root / 'provenance.json').write_text(
                  json.dumps(provenance, indent=2, sort_keys=True) + '\n'
              )
              print('PROVENANCE', json.dumps(provenance, sort_keys=True), flush=True)
              PY

              COMMON_ARGS="
                --development-root ${DATA}/Model_I
                --test-root ${DATA}/Model_I_test
                --cache-root ${CACHE} --image-size 96
                --encoder-variant micro-stat --physics-variant base
                --physics-summary moments --core quantum
                --quantum-encoding angle --observable-readout pair
                --heads 4 --reuploads 3 --epochs 12 --patience 6
                --validation-interval 1 --batch-size 256 --workers 4 --io-workers 8
                --encoder-learning-rate 0.0001 --learning-rate 0.0006
                --core-learning-rate 0.001 --weight-decay 0.0001
                --label-smoothing 0.02 --dropout 0.10
                --photon-noise-probability 0.5
                --photon-count-min 2048 --photon-count-max 8192
                --subtype-mixup-probability 1.0 --subtype-mixup-alpha 0.4
                --max-train-per-class 11667 --train-subset-protocol hash-v1
                --seed 0 --split-seed 42 --init-full-checkpoint ${SPATIAL}/best.pt"

              python -m d4_orqb.train ${COMMON_ARGS} \
                --output-dir ${ROOT}/mixup-control
              python -m d4_orqb.train ${COMMON_ARGS} \
                --distillation-teacher-checkpoint ${SPATIAL}/best.pt \
                --distillation-teacher-checkpoint ${KD}/best.pt \
                --distillation-weight 0.5 --distillation-temperature 2.0 \
                --output-dir ${ROOT}/mixup-kd

              python - <<'PY'
              import hashlib
              import json
              from pathlib import Path
              import numpy as np
              from d4_orqb.evaluate_locked import (
                  metrics_from_probabilities,
                  stratified_paired_bootstrap_accuracy,
              )

              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/subtype-mixup-kd50-01')
              reduced = root.parent
              model_root = reduced.parent
              expected_membership = '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71'
              expected_manifest = 'c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025'
              for name in ('mixup-control', 'mixup-kd'):
                  run = root / name
                  report = json.loads((run / 'data_report.json').read_text())
                  params = json.loads((run / 'parameter_report.json').read_text())
                  config = json.loads((run / 'config.json').read_text())
                  summary = json.loads((run / 'summary.json').read_text())
                  initialization = json.loads((run / 'initialization_report.json').read_text())
                  assert report['train_size'] == 35001
                  assert report['train_membership_sha256'] == expected_membership
                  assert report['development_manifest_sha256'] == expected_manifest
                  assert report['official_test_cache_opened'] is False
                  assert config['evaluate_test'] is False
                  assert config['subtype_mixup_probability'] == 1.0
                  assert config['subtype_mixup_alpha'] == 0.4
                  assert params['total'] == 122573 <= 122610
                  assert params['quantum'] == 132
                  assert summary['official_test_evaluated'] is False
                  assert initialization['checkpoint_sha256'] == '37dc7a2c518beafca3c4570c078012c323451a5327b6dcdc879586d92c8bc9cf'
                  if name == 'mixup-kd':
                      distillation = json.loads((run / 'distillation_report.json').read_text())
                      assert distillation['teacher_count'] == 2
                      assert distillation['teacher_parameters_total'] == 245010
                      assert distillation['official_test_opened'] is False

              paths = {
                  'mixup-control': root / 'mixup-control' / 'best_validation_predictions.npz',
                  'mixup-kd': root / 'mixup-kd' / 'best_validation_predictions.npz',
                  'spatial-stat-quantum': reduced / 'spatial-stat50-02' / 'quantum' / 'best_validation_predictions.npz',
                  'kd-student': reduced / 'kd-ensemble50-02' / 'student' / 'best_validation_predictions.npz',
                  'full-q0': model_root / 'full-development-01' / 'quantum' / 'best_validation_predictions.npz',
              }
              predictions = {}
              prediction_sha256 = {}
              reference_indices = reference_labels = None
              for name, path in paths.items():
                  prediction_sha256[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                  with np.load(path, allow_pickle=False) as data:
                      order = np.argsort(data['indices'])
                      indices = data['indices'][order]
                      labels = data['labels'][order]
                      probabilities = data['probabilities'][order].astype(np.float64)
                  if reference_indices is None:
                      reference_indices, reference_labels = indices, labels
                  else:
                      assert np.array_equal(indices, reference_indices)
                      assert np.array_equal(labels, reference_labels)
                  predictions[name] = probabilities
              predictions['spatial-kd-teacher'] = 0.5 * (
                  predictions['spatial-stat-quantum'] + predictions['kd-student']
              )
              metrics = {
                  name: metrics_from_probabilities(
                      reference_labels, probability, ['axion', 'cdm', 'no_sub']
                  )
                  for name, probability in predictions.items()
              }
              comparisons = {}
              for candidate, reference in (
                  ('mixup-control', 'spatial-stat-quantum'),
                  ('mixup-kd', 'mixup-control'),
                  ('mixup-kd', 'spatial-stat-quantum'),
                  ('mixup-kd', 'kd-student'),
                  ('mixup-kd', 'spatial-kd-teacher'),
                  ('mixup-kd', 'full-q0'),
              ):
                  comparisons[f'{candidate}-vs-{reference}'] = (
                      stratified_paired_bootstrap_accuracy(
                          reference_labels,
                          predictions[candidate],
                          predictions[reference],
                          samples=10000,
                          seed=20260715,
                      )
                  )
              result = {
                  'scope': 'Model-I development validation only; no test cache opened',
                  'source_sha256': '9affd833a0a750ff0672772a2879c13b06b5257ce94744238bdf3362359b3828',
                  'training_images': 35001,
                  'candidate_parameters': 122573,
                  'candidate_quantum_parameters': 132,
                  'training_only_teacher_parameters': 245010,
                  'metrics': metrics,
                  'comparisons': comparisons,
                  'prediction_file_sha256': prediction_sha256,
              }
              (root / 'analysis.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + '\n'
              )
              print('SUBTYPE_MIXUP_KD50_ANALYSIS', json.dumps(result, sort_keys=True), flush=True)
              PY
              chmod -R g+rX ${ROOT}
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
