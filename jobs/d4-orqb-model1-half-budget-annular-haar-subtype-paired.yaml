apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-haar-subres-pair-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: half-budget-annular-haar-subtype-paired
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-haar-subres-pair-01.XXXXXX)
              # Deliberately un-runnable until the final review pins the exact
              # aggregate src/tests digest. Do not replace during normal edits.
              EXPECTED_SOURCE_SHA256=267ba1dfb4e1af12bbd678e71d633ba45c1ca282b3167b4f1a99a3854cd3730f
              EXPECTED_BASE_HAAR_SHA256=9850a7d0c53b6332739696a9952b94a85a9ecea9c567fe5e0e85bdeef296b144
              EXPECTED_PRIMARY_PREDICTIONS_SHA256=96e375f1004f27e5032341604764126e9cb7f30ee319387da49df088d9b02569
              EXPECTED_MORPH_SHA256=dd4b8d01aeab5347e3c518a4731b30e52a02919fc5a815113d02af1cc19cbc0c
              EXPECTED_SPATIAL_SHA256=37dc7a2c518beafca3c4570c078012c323451a5327b6dcdc879586d92c8bc9cf
              EXPECTED_SELECTION_SPEC_SHA256=8c8aca6a0cf66ce4d547ec746851c7c698fbc9fe85b6262d70c94085d098d470
              EXPECTED_BASE_CONFIG_SHA256=534f5b4226198b364a6432e9849e3e5d22fe824ec713b5bbae01c6776478a13a
              EXPECTED_BASE_DATA_SHA256=6f8e03e63ad06113d4ab879110e1e0787882fac1e4c8ee6397c2a697e7beef19
              EXPECTED_BASE_PARAMETERS_SHA256=d032132e8a7339447b0d9d9d5dd512bffdf634dae7fd05afb1c942c42f77225d
              EXPECTED_BASE_SUMMARY_SHA256=40101740472283f5facef438901439a49843a07ad8b9e31dcc33b971cacd322f
              EXPECTED_FIXED_NORMALIZATION_SHA256=4f54483b2182984fed687a00fb1a96518891c37314b9ea9204cc47822bb2246a
              EXPECTED_HAAR_NORMALIZATION_SHA256=9b0121dbec0229b8e2744f0ead0279c3c2af0935869f010528967a6459681193
              EXPECTED_MORPH_NORMALIZATION_SHA256=848d4848ee4832a02843649a0a79b9284a4333fd7ce673200b4b1f647918dfbf
              EXPECTED_CACHE_IMAGES_SHA256=c3c639584e0a9e2d6ba369e3fb41ba0451b2170a362ec419fa1182e55d5ce070
              EXPECTED_CACHE_LABELS_SHA256=3a12100d1df155738b57255e6625ba1287c2d74c5bab53bce2cd0597afe89b17
              EXPECTED_CACHE_METADATA_SHA256=9f36faff5fc3300b97512b1c29439b2e993888318a31835938749e10fbf12379
              EXPECTED_CACHE_MANIFEST_SHA256=c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025
              EXPECTED_TRAIN_MEMBERSHIP_SHA256=571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71
              EXPECTED_VAL_MEMBERSHIP_SHA256=454935a294c5bb0f7c66c5b5c61072e469575b1ad68fda9fa3efb057db97ec52
              test "${EXPECTED_SOURCE_SHA256}" != "__REPLACE_AFTER_REDTEAM__"
              cp -a "${SOURCE_REPO}/src" "${RUN_REPO}/src"
              cp -a "${SOURCE_REPO}/tests" "${RUN_REPO}/tests"
              cd "${RUN_REPO}"
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256="${SOURCE_SHA256}"
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"
              export PYTHONPATH="${RUN_REPO}/src"
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export CUBLAS_WORKSPACE_CONFIG=:4096:8
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              python -m unittest discover -s tests -v
              nvidia-smi

              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              BASE=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data
              BASE_RUN=${BASE}/annular-haar50-01/quantum
              BASE_HAAR=${BASE_RUN}/best.pt
              PRIMARY_PREDICTIONS=${BASE_RUN}/best_validation_predictions.npz
              MORPH=${BASE}/morphology-fusion50-01/quantum/best.pt
              SPATIAL=${BASE}/spatial-stat50-02/quantum/best.pt
              DEV_CACHE=${CACHE}/model_i_96_v1/development
              ROOT=${BASE}/annular-haar50-subtype-residual-paired-01
              for path in "${BASE_HAAR}" "${PRIMARY_PREDICTIONS}" "${MORPH}" "${SPATIAL}"; do
                test -f "${path}"
                test ! -L "${path}"
              done
              for path in config.json data_report.json parameter_report.json summary.json fixed_summary_normalization.json haar_normalization.json morphology_normalization.json; do
                test -f "${BASE_RUN}/${path}"
                test ! -L "${BASE_RUN}/${path}"
              done
              for path in images.npy labels.npy metadata.json manifest.csv; do
                test -f "${DEV_CACHE}/${path}"
                test ! -L "${DEV_CACHE}/${path}"
              done
              BASE_HAAR_SHA256=$(sha256sum "${BASE_HAAR}" | cut -d' ' -f1)
              PRIMARY_PREDICTIONS_SHA256=$(sha256sum "${PRIMARY_PREDICTIONS}" | cut -d' ' -f1)
              MORPH_SHA256=$(sha256sum "${MORPH}" | cut -d' ' -f1)
              SPATIAL_SHA256=$(sha256sum "${SPATIAL}" | cut -d' ' -f1)
              test "${BASE_HAAR_SHA256}" = "${EXPECTED_BASE_HAAR_SHA256}"
              test "${PRIMARY_PREDICTIONS_SHA256}" = "${EXPECTED_PRIMARY_PREDICTIONS_SHA256}"
              test "${MORPH_SHA256}" = "${EXPECTED_MORPH_SHA256}"
              test "${SPATIAL_SHA256}" = "${EXPECTED_SPATIAL_SHA256}"
              test "$(sha256sum "${BASE_RUN}/config.json" | cut -d' ' -f1)" = "${EXPECTED_BASE_CONFIG_SHA256}"
              test "$(sha256sum "${BASE_RUN}/data_report.json" | cut -d' ' -f1)" = "${EXPECTED_BASE_DATA_SHA256}"
              test "$(sha256sum "${BASE_RUN}/parameter_report.json" | cut -d' ' -f1)" = "${EXPECTED_BASE_PARAMETERS_SHA256}"
              test "$(sha256sum "${BASE_RUN}/summary.json" | cut -d' ' -f1)" = "${EXPECTED_BASE_SUMMARY_SHA256}"
              test "$(sha256sum "${BASE_RUN}/fixed_summary_normalization.json" | cut -d' ' -f1)" = "${EXPECTED_FIXED_NORMALIZATION_SHA256}"
              test "$(sha256sum "${BASE_RUN}/haar_normalization.json" | cut -d' ' -f1)" = "${EXPECTED_HAAR_NORMALIZATION_SHA256}"
              test "$(sha256sum "${BASE_RUN}/morphology_normalization.json" | cut -d' ' -f1)" = "${EXPECTED_MORPH_NORMALIZATION_SHA256}"
              test "$(sha256sum "${DEV_CACHE}/images.npy" | cut -d' ' -f1)" = "${EXPECTED_CACHE_IMAGES_SHA256}"
              test "$(sha256sum "${DEV_CACHE}/labels.npy" | cut -d' ' -f1)" = "${EXPECTED_CACHE_LABELS_SHA256}"
              test "$(sha256sum "${DEV_CACHE}/metadata.json" | cut -d' ' -f1)" = "${EXPECTED_CACHE_METADATA_SHA256}"
              test "$(sha256sum "${DEV_CACHE}/manifest.csv" | cut -d' ' -f1)" = "${EXPECTED_CACHE_MANIFEST_SHA256}"
              test ! -e "${ROOT}"
              mkdir -p "${ROOT}"
              export ROOT SOURCE_SHA256 BASE_HAAR_SHA256 PRIMARY_PREDICTIONS_SHA256
              export MORPH_SHA256 SPATIAL_SHA256 EXPECTED_SELECTION_SPEC_SHA256
              export EXPECTED_CACHE_IMAGES_SHA256 EXPECTED_CACHE_LABELS_SHA256
              export EXPECTED_CACHE_METADATA_SHA256 EXPECTED_CACHE_MANIFEST_SHA256
              export EXPECTED_TRAIN_MEMBERSHIP_SHA256 EXPECTED_VAL_MEMBERSHIP_SHA256

              python - <<'PY'
              import json
              import os
              from pathlib import Path

              provenance = {
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'base_haar_checkpoint_sha256': os.environ['BASE_HAAR_SHA256'],
                  'base_haar_predictions_sha256': os.environ[
                      'PRIMARY_PREDICTIONS_SHA256'
                  ],
                  'distillation_teacher_sha256': [
                      os.environ['MORPH_SHA256'], os.environ['SPATIAL_SHA256']
                  ],
                  'selection_spec_sha256': os.environ[
                      'EXPECTED_SELECTION_SPEC_SHA256'
                  ],
                  'development_cache_sha256': {
                      'images.npy': os.environ['EXPECTED_CACHE_IMAGES_SHA256'],
                      'labels.npy': os.environ['EXPECTED_CACHE_LABELS_SHA256'],
                      'metadata.json': os.environ['EXPECTED_CACHE_METADATA_SHA256'],
                      'manifest.csv': os.environ['EXPECTED_CACHE_MANIFEST_SHA256'],
                  },
                  'train_membership_sha256': os.environ[
                      'EXPECTED_TRAIN_MEMBERSHIP_SHA256'
                  ],
                  'validation_membership_sha256': os.environ[
                      'EXPECTED_VAL_MEMBERSHIP_SHA256'
                  ],
                  'candidate': (
                      'plain 15-parameter invariant Haar subtype residual with '
                      'ordinary full shared-parameter fine-tuning'
                  ),
                  'control': (
                      'identical allocated residual architecture with only the '
                      '15 residual weights frozen at exact zero'
                  ),
                  'forbidden_modes': [
                      'haar-subtype-max-envelope',
                      'freeze-base-for-haar-subtype-residual',
                  ],
                  'training_images': 35001,
                  'allocated_inference_parameters': 122610,
                  'allocated_quantum_parameters': 88,
                  'candidate_optimizer_parameters': 122610,
                  'control_optimizer_parameters': 122595,
                  'fixed_endpoint_epoch': 15,
                  'checkpoint_selection': 'fixed final validation at epoch 15 only',
                  'predeclared_absolute_gate': {
                      'correct_at_least': 16750,
                      'macro_auc_ovr_at_least': 0.992624009,
                      'nll_at_most': 0.145002319,
                  },
                  'predeclared_paired_gate': {
                      'candidate_correct_strictly_greater_than_control': True,
                      'bootstrap_accuracy_ci95_low_strictly_greater_than_zero': True,
                      'mcnemar_exact_two_sided_p_strictly_less_than': 0.05,
                      'maximum_correct_loss_per_class_vs_control': 2,
                  },
                  'selection_scope': 'Model-I development validation only',
                  'official_test_opened': False,
              }
              root = Path(os.environ['ROOT'])
              (root / 'provenance.json').write_text(
                  json.dumps(provenance, indent=2, sort_keys=True) + '\n'
              )
              print('PROVENANCE', json.dumps(provenance, sort_keys=True), flush=True)
              PY

              COMMON="--development-root ${DATA}/Model_I --test-root ${DATA}/Model_I_test --cache-root ${CACHE} --image-size 96 --encoder-variant deep-se-haar-morph --physics-variant base --physics-summary moments-morphology-haar --core quantum --quantum-encoding angle --observable-readout pair --heads 4 --reuploads 2 --haar-subtype-residual --epochs 15 --patience 16 --validation-interval 15 --fixed-final-validation-only --batch-size 256 --workers 4 --io-workers 8 --encoder-learning-rate 0.00005 --learning-rate 0.0006 --core-learning-rate 0.001 --weight-decay 0.0001 --label-smoothing 0.02 --dropout 0.10 --photon-noise-probability 0.5 --photon-count-min 2048 --photon-count-max 8192 --max-train-per-class 11667 --train-subset-protocol hash-v1 --seed 0 --split-seed 42 --deterministic --init-full-checkpoint ${BASE_HAAR} --distillation-teacher-checkpoint ${MORPH} --distillation-teacher-checkpoint ${SPATIAL} --distillation-weight 0.70 --distillation-temperature 2.0"

              python -m d4_orqb.train ${COMMON} \
                --output-dir "${ROOT}/subtype-trainable"

              python -m d4_orqb.train ${COMMON} \
                --freeze-haar-subtype-residual-at-zero \
                --output-dir "${ROOT}/subtype-zero-control"

              python - <<'PY'
              import hashlib
              import json
              import math
              import os
              from pathlib import Path

              import numpy as np

              from d4_orqb.data import index_membership_sha256
              from d4_orqb.evaluate_locked import (
                  metrics_from_probabilities,
                  stratified_paired_bootstrap_accuracy,
              )


              def sha256(path):
                  digest = hashlib.sha256()
                  with path.open('rb') as handle:
                      for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                          digest.update(chunk)
                  return digest.hexdigest()


              root = Path(os.environ['ROOT'])
              expected_membership = (
                  '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71'
              )
              expected_val_membership = (
                  '454935a294c5bb0f7c66c5b5c61072e469575b1ad68fda9fa3efb057db97ec52'
              )
              expected_manifest = (
                  'c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025'
              )
              expected_selection_spec = os.environ[
                  'EXPECTED_SELECTION_SPEC_SHA256'
              ]
              expected_selected_indices = [
                  31, 50, 42, 25, 36, 19, 24, 30,
                  37, 48, 13, 7, 52, 18, 45,
              ]
              expected_teacher_hashes = [
                  os.environ['MORPH_SHA256'], os.environ['SPATIAL_SHA256']
              ]
              candidate_name = 'subtype-trainable'
              control_name = 'subtype-zero-control'
              runs = {
                  candidate_name: root / candidate_name,
                  control_name: root / control_name,
              }
              artifact_names = (
                  'best.pt',
                  'last.pt',
                  'best_validation_predictions.npz',
                  'config.json',
                  'data_report.json',
                  'parameter_report.json',
                  'summary.json',
                  'initialization_report.json',
                  'haar_subtype_selection.json',
                  'distillation_report.json',
                  'fixed_summary_normalization.json',
                  'haar_normalization.json',
                  'morphology_normalization.json',
                  'history.json',
                  'split_indices.npz',
                  'symmetry_audit.json',
              )
              configs = {}
              metrics = {}
              predictions = {}
              summaries = {}
              artifacts = {}
              selections = {}
              splits = {}
              reference_indices = reference_labels = None

              for name, run in runs.items():
                  expected_frozen = name == control_name
                  for artifact_name in artifact_names:
                      path = run / artifact_name
                      assert path.is_file() and not path.is_symlink(), path
                  artifacts[name] = {
                      artifact_name: sha256(run / artifact_name)
                      for artifact_name in artifact_names
                  }
                  config = json.loads((run / 'config.json').read_text())
                  data = json.loads((run / 'data_report.json').read_text())
                  params = json.loads((run / 'parameter_report.json').read_text())
                  summary = json.loads((run / 'summary.json').read_text())
                  initialization = json.loads(
                      (run / 'initialization_report.json').read_text()
                  )
                  selection = json.loads(
                      (run / 'haar_subtype_selection.json').read_text()
                  )
                  distillation = json.loads(
                      (run / 'distillation_report.json').read_text()
                  )
                  history = json.loads((run / 'history.json').read_text())

                  assert data['train_size'] == 35001
                  assert data['validation_size'] == 17504
                  assert data['train_membership_sha256'] == expected_membership
                  assert data['development_manifest_sha256'] == expected_manifest
                  assert data['class_names'] == ['axion', 'cdm', 'no_sub']
                  assert data['official_test_cache_opened'] is False
                  assert data['official_test_locked_during_selection'] is True
                  assert 'test' not in data

                  assert config['evaluate_test'] is False
                  assert config['deterministic'] is True
                  assert config['seed'] == 0 and config['split_seed'] == 42
                  assert config['epochs'] == 15
                  assert config['patience'] == 16
                  assert config['validation_interval'] == 15
                  assert config['fixed_final_validation_only'] is True
                  assert config['haar_subtype_residual'] is True
                  assert config['freeze_haar_subtype_residual_at_zero'] is expected_frozen
                  assert config['haar_subtype_max_envelope'] is False
                  assert config['freeze_base_for_haar_subtype_residual'] is False
                  assert config['tied_mean_dispersion'] is False
                  assert config['shared_late_refinement'] is False
                  assert config['r2_entanglers'] is False
                  assert config['equatorial_readout'] is False
                  assert config['meridional_readout'] is False
                  assert config['reinitialize_core_after_init'] is False
                  assert config['train_subset_protocol'] == 'hash-v1'
                  assert config['max_train_per_class'] == 11667

                  assert params['total'] == 122610
                  assert params['inference_total'] == 122610
                  assert params['quantum'] == 88
                  assert params['inference_quantum'] == 88
                  assert params['quantum_optimization_trainable'] == 88
                  assert params['haar_subtype_residual_trainable'] == 15
                  assert params['optimization_trainable_total'] == (
                      122595 if expected_frozen else 122610
                  )
                  assert params[
                      'haar_subtype_residual_optimization_trainable'
                  ] == (0 if expected_frozen else 15)
                  assert params[
                      'haar_subtype_residual_frozen_at_zero'
                  ] is expected_frozen

                  assert initialization['checkpoint_sha256'] == os.environ[
                      'BASE_HAAR_SHA256'
                  ]
                  assert initialization['method'] == (
                      'haar-to-zero-subtype-residual-exact-remap'
                  )
                  residual_init = initialization['haar_subtype_residual']
                  assert residual_init['all_weights_zero_after_remap'] is True
                  assert residual_init['selection_spec_sha256'] == expected_selection_spec
                  replay = residual_init['exact_replay']
                  assert replay['exact_logits'] is True
                  assert replay['predictions_equal'] is True
                  assert replay['residual_weights_all_zero'] is True
                  assert replay['nonresidual_state_bitwise_equal'] is True
                  assert replay['max_logit_absolute_difference'] == 0.0

                  assert selection['selection_spec_sha256'] == expected_selection_spec
                  assert selection['selected_indices'] == expected_selected_indices
                  assert selection['fit_images'] == 35001
                  assert selection['fit_views'] == 280008
                  assert selection['selection_samples'] == 23334
                  assert selection['class_counts'] == {
                      'axion': 11667, 'cdm': 11667
                  }
                  assert selection['no_sub_selection_samples'] == 0
                  assert selection['validation_samples_used'] == 0
                  assert selection['official_test_samples_used'] == 0
                  assert selection['train_membership_sha256'] == expected_membership
                  assert selection['development_manifest_sha256'] == expected_manifest
                  assert selection['source_checkpoint_sha256'] == os.environ[
                      'BASE_HAAR_SHA256'
                  ]

                  assert distillation['teacher_count'] == 2
                  assert [
                      teacher['checkpoint_sha256']
                      for teacher in distillation['teachers']
                  ] == expected_teacher_hashes
                  assert distillation['train_membership_sha256'] == expected_membership
                  assert distillation['development_manifest_sha256'] == expected_manifest
                  assert distillation['same_training_indices'] is True
                  assert distillation['same_validation_indices'] is True
                  assert distillation['official_test_opened'] is False

                  assert len(history) == 15
                  assert all(
                      record['validation'] is None for record in history[:-1]
                  )
                  assert history[-1]['epoch'] == 15
                  assert history[-1]['validation'] is not None
                  assert summary['best_epoch'] == 15
                  assert summary['official_test_evaluated'] is False
                  assert 'test' not in summary
                  assert summary['parameters'] == params
                  assert summary['core_update_l2'] > 0.0
                  subtype = summary['haar_subtype_residual']
                  assert subtype['trainable_parameters'] == 15
                  assert subtype['optimization_trainable'] == (
                      0 if expected_frozen else 15
                  )
                  assert subtype['frozen_at_zero_control'] is expected_frozen
                  assert subtype['selection_spec_sha256'] == expected_selection_spec
                  assert subtype['selected_indices'] == expected_selected_indices
                  if expected_frozen:
                      assert subtype['weights_exact_zero'] is True
                      assert subtype['weight_update_l2'] == 0.0
                      assert subtype['weight_l2'] == 0.0
                      assert subtype['weights'] == [0.0] * 15
                  else:
                      assert subtype['weights_exact_zero'] is False
                      assert subtype['weight_update_l2'] > 0.0
                      assert subtype['weight_l2'] > 0.0

                  with np.load(run / 'split_indices.npz', allow_pickle=False) as values:
                      train_indices = values['train'].astype(np.int64)
                      val_indices = values['val'].astype(np.int64)
                  assert len(train_indices) == 35001
                  assert len(val_indices) == 17504
                  assert index_membership_sha256(train_indices) == expected_membership
                  assert index_membership_sha256(val_indices) == expected_val_membership
                  assert np.intersect1d(
                      train_indices, val_indices, assume_unique=True
                  ).size == 0
                  splits[name] = (train_indices, val_indices)

                  prediction_path = run / 'best_validation_predictions.npz'
                  with np.load(prediction_path, allow_pickle=False) as values:
                      order = np.argsort(values['indices'])
                      indices = values['indices'][order].astype(np.int64)
                      labels = values['labels'][order].astype(np.int64)
                      probabilities = values['probabilities'][order].astype(
                          np.float64
                      )
                  assert index_membership_sha256(indices) == expected_val_membership
                  if reference_indices is None:
                      reference_indices = indices
                      reference_labels = labels
                  else:
                      assert np.array_equal(indices, reference_indices)
                      assert np.array_equal(labels, reference_labels)
                  predictions[name] = probabilities
                  metrics[name] = metrics_from_probabilities(
                      labels, probabilities, ['axion', 'cdm', 'no_sub']
                  )
                  configs[name] = config
                  summaries[name] = summary
                  selections[name] = selection

              assert np.array_equal(
                  splits[candidate_name][0], splits[control_name][0]
              )
              assert np.array_equal(
                  splits[candidate_name][1], splits[control_name][1]
              )
              ignored = {
                  'output_dir', 'freeze_haar_subtype_residual_at_zero'
              }
              assert {
                  key: value for key, value in configs[candidate_name].items()
                  if key not in ignored
              } == {
                  key: value for key, value in configs[control_name].items()
                  if key not in ignored
              }
              assert artifacts[candidate_name][
                  'haar_subtype_selection.json'
              ] == artifacts[control_name]['haar_subtype_selection.json']
              assert selections[candidate_name] == selections[control_name]

              primary_path = (
                  root.parent
                  / 'annular-haar50-01'
                  / 'quantum'
                  / 'best_validation_predictions.npz'
              )
              assert primary_path.is_file() and not primary_path.is_symlink()
              assert sha256(primary_path) == os.environ[
                  'PRIMARY_PREDICTIONS_SHA256'
              ]
              with np.load(primary_path, allow_pickle=False) as values:
                  order = np.argsort(values['indices'])
                  primary_indices = values['indices'][order].astype(np.int64)
                  primary_labels = values['labels'][order].astype(np.int64)
                  primary_probabilities = values['probabilities'][order].astype(
                      np.float64
                  )
              assert np.array_equal(primary_indices, reference_indices)
              assert np.array_equal(primary_labels, reference_labels)
              predictions['primary-base-haar'] = primary_probabilities
              metrics['primary-base-haar'] = metrics_from_probabilities(
                  reference_labels,
                  primary_probabilities,
                  ['axion', 'cdm', 'no_sub'],
              )

              bootstrap = stratified_paired_bootstrap_accuracy(
                  reference_labels,
                  predictions[candidate_name],
                  predictions[control_name],
                  samples=100000,
                  seed=20260803,
              )
              bootstrap_vs_primary = stratified_paired_bootstrap_accuracy(
                  reference_labels,
                  predictions[candidate_name],
                  predictions['primary-base-haar'],
                  samples=100000,
                  seed=20260804,
              )
              candidate_prediction = predictions[candidate_name].argmax(1)
              control_prediction = predictions[control_name].argmax(1)
              candidate_correct_mask = candidate_prediction == reference_labels
              control_correct_mask = control_prediction == reference_labels
              candidate_correct = int(candidate_correct_mask.sum())
              control_correct = int(control_correct_mask.sum())
              candidate_only = int(
                  (candidate_correct_mask & ~control_correct_mask).sum()
              )
              control_only = int(
                  (~candidate_correct_mask & control_correct_mask).sum()
              )
              discordant = candidate_only + control_only
              if discordant:
                  tail = sum(
                      math.comb(discordant, k)
                      for k in range(min(candidate_only, control_only) + 1)
                  ) / (2 ** discordant)
                  mcnemar_p = min(1.0, 2.0 * tail)
              else:
                  mcnemar_p = 1.0

              per_class_correct = {}
              per_class_delta = {}
              for class_index, class_name in enumerate(
                  ('axion', 'cdm', 'no_sub')
              ):
                  mask = reference_labels == class_index
                  candidate_class_correct = int(
                      (candidate_correct_mask & mask).sum()
                  )
                  control_class_correct = int(
                      (control_correct_mask & mask).sum()
                  )
                  per_class_correct[class_name] = {
                      candidate_name: candidate_class_correct,
                      control_name: control_class_correct,
                  }
                  per_class_delta[class_name] = (
                      candidate_class_correct - control_class_correct
                  )

              candidate_metrics = metrics[candidate_name]
              passed_absolute = (
                  candidate_correct >= 16750
                  and candidate_metrics['macro_auc_ovr'] >= 0.992624009
                  and candidate_metrics['nll'] <= 0.145002319
              )
              passed_paired = (
                  candidate_correct > control_correct
                  and bootstrap['ci95_low'] > 0.0
                  and mcnemar_p < 0.05
                  and min(per_class_delta.values()) >= -2
              )
              passed = passed_absolute and passed_paired
              result = {
                  'scope': (
                      'Model-I development validation only; official test unopened'
                  ),
                  'causal_claim_scope': (
                      'paired fixed-epoch continuations differ only in whether '
                      'the allocated 15-weight classical invariant subtype '
                      'residual is optimized or held at exact zero'
                  ),
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'base_haar_checkpoint_sha256': os.environ[
                      'BASE_HAAR_SHA256'
                  ],
                  'selection_spec_sha256': expected_selection_spec,
                  'training_images': 35001,
                  'allocated_parameters': 122610,
                  'quantum_parameters': 88,
                  'fixed_endpoint_epoch': 15,
                  'predeclared_absolute_gate': {
                      'correct_at_least': 16750,
                      'macro_auc_ovr_at_least': 0.992624009,
                      'nll_at_most': 0.145002319,
                  },
                  'predeclared_paired_gate': {
                      'candidate_correct_strictly_greater_than_control': True,
                      'bootstrap_ci95_low_strictly_greater_than_zero': True,
                      'mcnemar_exact_two_sided_p_strictly_less_than': 0.05,
                      'maximum_correct_loss_per_class_vs_control': 2,
                  },
                  'passed_absolute_gate': passed_absolute,
                  'passed_paired_gate': passed_paired,
                  'passed_full_gate': passed,
                  'candidate_correct': candidate_correct,
                  'control_correct': control_correct,
                  'metrics': metrics,
                  'paired_bootstrap_accuracy': bootstrap,
                  'bootstrap_accuracy_vs_primary_context': bootstrap_vs_primary,
                  'candidate_only_correct': candidate_only,
                  'control_only_correct': control_only,
                  'mcnemar_exact_two_sided_p': mcnemar_p,
                  'per_class_correct': per_class_correct,
                  'per_class_candidate_minus_control_correct': per_class_delta,
                  'artifacts_sha256': artifacts,
                  'best_epochs': {
                      name: int(summary['best_epoch'])
                      for name, summary in summaries.items()
                  },
                  'official_test_opened': False,
              }
              output = root / 'paired_analysis.json'
              temporary = root / 'paired_analysis.json.tmp'
              temporary.write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False)
                  + '\n'
              )
              os.replace(temporary, output)
              print(
                  'HAAR_SUBTYPE_PAIRED_ANALYSIS',
                  json.dumps(result, sort_keys=True),
                  flush=True,
              )
              PY
            env:
            - name: XDG_CACHE_HOME
              value: /workspace/data/cache/xdg
            - name: TORCH_HOME
              value: /workspace/data/cache/torch
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
