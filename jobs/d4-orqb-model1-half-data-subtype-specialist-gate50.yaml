apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: d4-orqb-m1-half-subspec50-01
  namespace: sbg-mechanistic-interpretability
  labels:
    project: deeplense-quantum
    dataset: model-i
    stage: half-data-subtype-specialist-gate
spec:
  nprocPerNode: "1"
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          containers:
          - name: pytorch
            image: docker.io/pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
            command: [bash, -lc]
            args:
            - |
              set -euo pipefail
              SOURCE_REPO=/workspace/data/repos/deeplense-quantum
              RUN_REPO=$(mktemp -d /tmp/deeplense-quantum-subspec50-01.XXXXXX)
              EXPECTED_SOURCE_SHA256=1ee35e026e6bc4b84822d0134896b1c837882beb08bcfce2398ec575fc533a98
              cp -a ${SOURCE_REPO}/src ${RUN_REPO}/src
              cp -a ${SOURCE_REPO}/tests ${RUN_REPO}/tests
              cd ${RUN_REPO}
              export LC_ALL=C
              SOURCE_SHA256=$(find src/d4_orqb tests -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
              echo SOURCE_SHA256=${SOURCE_SHA256}
              test "${SOURCE_SHA256}" = "${EXPECTED_SOURCE_SHA256}"
              export PYTHONPATH=${RUN_REPO}/src
              export PYTHONUNBUFFERED=1
              export OMP_NUM_THREADS=4
              export MKL_NUM_THREADS=4
              export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256

              python -m unittest discover -s tests -v
              nvidia-smi
              DATA=/workspace/data/datasets/DEEPLENS_DATASETS
              CACHE=/workspace/data/cache/d4-orqb
              BASE=/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data
              ROOT=${BASE}/subtype-specialist-gate50-01
              mkdir -p ${ROOT}
              export ROOT SOURCE_SHA256

              python - <<'PY'
              import json
              import os
              from pathlib import Path

              provenance = {
                  'source_sha256': os.environ['SOURCE_SHA256'],
                  'candidate': 'validation-gated binary axion/CDM specialist',
                  'architecture': 'small SE encoder, classical orbit core, invariant context and morphology',
                  'candidate_role': 'training-only teacher architecture gate',
                  'parent_training_images': 35001,
                  'binary_training_images': 23334,
                  'parent_train_membership_sha256': '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71',
                  'binary_train_membership_sha256': '13911cb64166ad2d6ba1112e295a834b6018030473d44514b1280c9a9eb2f1bd',
                  'predeclared_gate_binary_accuracy': 0.95,
                  'predeclared_gate_binary_auc': 0.99,
                  'selection_scope': 'Model-I subtype development validation only',
                  'official_test_opened': False,
              }
              root = Path(os.environ['ROOT'])
              (root / 'provenance.json').write_text(
                  json.dumps(provenance, indent=2, sort_keys=True) + '\n'
              )
              print('PROVENANCE', json.dumps(provenance, sort_keys=True), flush=True)
              PY

              python -m d4_orqb.train \
                --development-root ${DATA}/Model_I \
                --test-root ${DATA}/Model_I_test \
                --cache-root ${CACHE} --image-size 96 \
                --subtype-specialist \
                --encoder-variant small --physics-variant base \
                --physics-summary moments-morphology --core classical --include-context \
                --quantum-encoding angle --observable-readout pair \
                --heads 4 --reuploads 2 --epochs 36 --patience 10 \
                --validation-interval 1 --batch-size 256 --workers 4 --io-workers 8 \
                --encoder-learning-rate 0.0002 --learning-rate 0.0008 \
                --core-learning-rate 0.0008 --weight-decay 0.001 \
                --label-smoothing 0.03 --dropout 0.25 \
                --photon-noise-probability 0.5 \
                --photon-count-min 2048 --photon-count-max 8192 \
                --max-train-per-class 11667 --train-subset-protocol hash-v1 \
                --seed 0 --split-seed 42 \
                --output-dir ${ROOT}/specialist

              python - <<'PY'
              import hashlib
              import json
              from pathlib import Path
              import numpy as np
              from d4_orqb.evaluate_locked import metrics_from_probabilities

              root = Path('/workspace/data/outputs/deeplense-quantum/d4-orqb/model-i/reduced-data/subtype-specialist-gate50-01')
              run = root / 'specialist'
              reduced = root.parent
              model_root = reduced.parent
              expected_parent = '571d23ced25095cf0cfb57216654f9b7be289b0589a95489a5a815a866aaee71'
              expected_binary = '13911cb64166ad2d6ba1112e295a834b6018030473d44514b1280c9a9eb2f1bd'
              expected_val = '61117f265f7cc55676fa071b9a8eda226738a380add39fe7fcb1e8aa8943fcc9'
              expected_manifest = 'c04a3c62afebe3f660ffaad4333b6632471a91c6f5f239f84e68b4b94c330025'
              report = json.loads((run / 'data_report.json').read_text())
              params = json.loads((run / 'parameter_report.json').read_text())
              config = json.loads((run / 'config.json').read_text())
              summary = json.loads((run / 'summary.json').read_text())
              normalization = json.loads((run / 'morphology_normalization.json').read_text())
              task = report['subtype_specialist']
              assert config['evaluate_test'] is False and config['subtype_specialist'] is True
              assert report['class_names'] == ['axion', 'cdm']
              assert report['train_size'] == 23334
              assert report['validation_size'] == 11733
              assert report['train_counts'] == {'axion': 11667, 'cdm': 11667}
              assert report['train_membership_sha256'] == expected_binary
              assert task['parent_train_size'] == 35001
              assert task['parent_train_membership_sha256'] == expected_parent
              assert task['subtype_validation_membership_sha256'] == expected_val
              assert report['development_manifest_sha256'] == expected_manifest
              assert report['official_test_cache_opened'] is False
              assert summary['official_test_evaluated'] is False
              assert params['total'] == 713734
              assert params['quantum'] == 0
              assert normalization['fit_samples'] == 23334
              assert normalization['validation_samples_used'] == 0
              assert normalization['official_test_samples_used'] == 0

              with np.load(run / 'best_validation_predictions.npz', allow_pickle=False) as data:
                  order = np.argsort(data['indices'])
                  indices = data['indices'][order]
                  labels = data['labels'][order]
                  specialist = data['probabilities'][order].astype(np.float64)

              reference_paths = {
                  'strict-student-conditional': reduced / 'morphology-fusion-kd50-01' / 'student' / 'best_validation_predictions.npz',
                  'full-q0-conditional': model_root / 'full-development-01' / 'quantum' / 'best_validation_predictions.npz',
              }
              predictions = {'binary-specialist': specialist}
              reference_sha256 = {}
              for name, path in reference_paths.items():
                  reference_sha256[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                  with np.load(path, allow_pickle=False) as data:
                      mask = data['labels'] < 2
                      ref_indices = data['indices'][mask]
                      ref_labels = data['labels'][mask]
                      values = data['probabilities'][mask, :2].astype(np.float64)
                  ref_order = np.argsort(ref_indices)
                  ref_indices = ref_indices[ref_order]
                  ref_labels = ref_labels[ref_order]
                  values = values[ref_order]
                  values /= values.sum(axis=1, keepdims=True)
                  assert np.array_equal(ref_indices, indices)
                  assert np.array_equal(ref_labels, labels)
                  predictions[name] = values
              metrics = {
                  name: metrics_from_probabilities(labels, probability, ['axion', 'cdm'])
                  for name, probability in predictions.items()
              }
              candidate = metrics['binary-specialist']
              passed = candidate['accuracy'] >= 0.95 and candidate['macro_auc_ovr'] >= 0.99
              result = {
                  'scope': 'Model-I subtype development validation only; no test cache opened',
                  'training_only_teacher': True,
                  'parent_training_images': 35001,
                  'binary_training_images': 23334,
                  'teacher_parameters': 713734,
                  'predeclared_gate_binary_accuracy': 0.95,
                  'predeclared_gate_binary_auc': 0.99,
                  'passed_crossfit_promotion_gate': passed,
                  'metrics': metrics,
                  'checkpoint_sha256': hashlib.sha256((run / 'best.pt').read_bytes()).hexdigest(),
                  'prediction_sha256': hashlib.sha256((run / 'best_validation_predictions.npz').read_bytes()).hexdigest(),
                  'reference_prediction_sha256': reference_sha256,
              }
              (root / 'analysis.json').write_text(
                  json.dumps(result, indent=2, sort_keys=True, allow_nan=False) + '\n'
              )
              print('SUBTYPE_SPECIALIST_GATE50_ANALYSIS', json.dumps(result, sort_keys=True), flush=True)
              PY
            env:
            - name: XDG_CACHE_HOME
              value: /workspace/data/cache/xdg
            - name: TORCH_HOME
              value: /workspace/data/cache/torch
            volumeMounts:
            - name: data-volume
              mountPath: /workspace/data
            resources:
              requests:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "4"
                memory: 32Gi
                nvidia.com/gpu: "1"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: susmered-datavol-1
  runPolicy:
    cleanPodPolicy: None
    suspend: false
